<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMath" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bgMath)"/>

  <!-- Geometric Grid Background Lines -->
  <g stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5">
    <line x1="0" y1="80" x2="600" y2="80"/>
    <line x1="0" y1="160" x2="600" y2="160"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="120" y1="0" x2="120" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/>
    <line x1="360" y1="0" x2="360" y2="400"/>
    <line x1="480" y1="0" x2="480" y2="400"/>
  </g>

  <!-- Mathematical & Scientific Symbols -->
  <g transform="translate(300, 180)">
    <!-- Central Blackboard Card -->
    <rect x="-120" y="-70" width="240" height="140" rx="12" fill="#0f172a" stroke="#60a5fa" stroke-width="2.5"/>
    
    <!-- Mathematical Formulas & Glyphs -->
    <text x="-70" y="-20" font-family="'Courier New', monospace" font-size="34" font-weight="900" fill="#38bdf8">∑</text>
    <text x="0" y="-20" font-family="'Courier New', monospace" font-size="32" font-weight="900" fill="#f43f5e">√x</text>
    <text x="65" y="-20" font-family="'Courier New', monospace" font-size="32" font-weight="900" fill="#facc15">π</text>

    <!-- Function Graph curve -->
    <path d="M -90 40 Q -45 -10, 0 35 T 90 20" fill="none" stroke="#4ade80" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="0" cy="35" r="4" fill="#fff"/>
    <circle cx="90" cy="20" r="4" fill="#fff"/>
  </g>

  <!-- Title Badge -->
  <g transform="translate(300, 340)">
    <rect x="-170" y="-22" width="340" height="42" rx="21" fill="rgba(15, 23, 42, 0.75)" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="0" y="6" font-family="'Cairo', sans-serif" font-weight="800" font-size="20" fill="#93c5fd" text-anchor="middle">دروس الدعم في الرياضيات والعلوم</text>
  </g>
</svg>
