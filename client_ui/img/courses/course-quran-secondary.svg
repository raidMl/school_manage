<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgQuran3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gold3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <radialGradient id="glow3" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#312e81" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bgQuran3)"/>
  <circle cx="300" cy="180" r="160" fill="url(#glow3)"/>

  <!-- Sanad / Chain of Transmission Scroll & Graduation Cap Motif -->
  <g transform="translate(300, 185)">
    <!-- Scroll Base -->
    <rect x="-100" y="-70" width="200" height="140" rx="8" fill="#fffbeb" stroke="url(#gold3)" stroke-width="2.5"/>
    <path d="M -112 -70 Q -100 -80, -100 -70 L -100 70 Q -112 80, -112 70 Z" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
    <path d="M 112 -70 Q 100 -80, 100 -70 L 100 70 Q 112 80, 112 70 Z" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
    
    <!-- Quran / Tajweed Verses Emblems -->
    <path d="M -70 -40 L 70 -40 M -70 -20 L 70 -20 M -70 0 L 70 0 M -70 20 L 70 20 M -40 40 L 40 40" stroke="#b45309" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    
    <!-- Red Seal of Sanad / Authorization -->
    <circle cx="0" cy="5" r="24" fill="#dc2626" stroke="url(#gold3)" stroke-width="2"/>
    <polygon points="0,-14 4,-3 14,-3 6,4 9,14 0,8 -9,14 -6,4 -14,-3 -4,-3" fill="#fef08a"/>
  </g>

  <!-- Title Badge -->
  <g transform="translate(300, 340)">
    <rect x="-190" y="-22" width="380" height="42" rx="21" fill="rgba(15, 23, 42, 0.75)" stroke="url(#gold3)" stroke-width="1.5"/>
    <text x="0" y="6" font-family="'Cairo', 'Amiri', sans-serif" font-weight="800" font-size="19" fill="#fef08a" text-anchor="middle">التعليم القرآني متوسط وثانوي والإجازات</text>
  </g>
</svg>
