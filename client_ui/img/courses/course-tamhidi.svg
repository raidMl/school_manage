<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgTamhidi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="50%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bgTamhidi)"/>

  <!-- Playful Early Childhood Discovery Elements -->
  <g transform="translate(300, 190)">
    <!-- Colored Rings & Shapes -->
    <circle cx="-90" cy="10" r="38" fill="#f43f5e" opacity="0.9"/>
    <text x="-90" y="24" font-family="'Cairo', sans-serif" font-size="40" font-weight="900" fill="#fff" text-anchor="middle">١</text>

    <rect x="-35" y="-35" width="70" height="70" rx="18" fill="#8b5cf6" opacity="0.95"/>
    <text x="0" y="14" font-family="'Cairo', sans-serif" font-size="40" font-weight="900" fill="#fff" text-anchor="middle">٢</text>

    <polygon points="90,-35 130,45 50,45" fill="#f59e0b" opacity="0.9"/>
    <text x="90" y="32" font-family="'Cairo', sans-serif" font-size="34" font-weight="900" fill="#fff" text-anchor="middle">٣</text>

    <!-- Smiling Star -->
    <polygon points="0,-85 6,-68 24,-68 10,-57 15,-40 0,-50 -15,-40 -10,-57 -24,-68 -6,-68" fill="#fde047"/>
  </g>

  <!-- Title Badge -->
  <g transform="translate(300, 340)">
    <rect x="-170" y="-22" width="340" height="42" rx="21" fill="rgba(15, 23, 42, 0.75)" stroke="#2dd4bf" stroke-width="1.5"/>
    <text x="0" y="6" font-family="'Cairo', sans-serif" font-weight="800" font-size="20" fill="#ccfbf1" text-anchor="middle">القسم التمهيدي (براعم الهدى)</text>
  </g>
</svg>
