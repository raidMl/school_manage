<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgQuran2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="gold2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="glow2" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bgQuran2)"/>
  <circle cx="300" cy="180" r="160" fill="url(#glow2)"/>

  <!-- School Backpack & Holy Quran Elements -->
  <g transform="translate(300, 190)">
    <!-- Quran Book -->
    <path d="M -85 20 C -45 5, -15 15, 0 35 C 15 15, 45 5, 85 20 C 85 -55, 45 -65, 0 -45 C -45 -65, -85 -55, -85 20 Z" fill="#fffbeb" stroke="url(#gold2)" stroke-width="3"/>
    <line x1="0" y1="-45" x2="0" y2="35" stroke="#0284c7" stroke-width="3"/>
    <!-- Central Emblem -->
    <circle cx="0" cy="-6" r="18" fill="#e0f2fe" stroke="url(#gold2)" stroke-width="2"/>
    <text x="0" y="0" font-family="'Amiri', serif" font-size="16" font-weight="900" fill="#0369a1" text-anchor="middle">القرآن</text>

    <!-- Pencil & Ruler -->
    <g transform="translate(-110, -20) rotate(-35)">
      <rect x="-8" y="-45" width="16" height="90" rx="3" fill="#f59e0b"/>
      <polygon points="-8,-45 0,-65 8,-45" fill="#fde68a"/>
      <polygon points="-3,-58 0,-65 3,-58" fill="#1e293b"/>
    </g>
    <!-- Award Ribbon -->
    <g transform="translate(115, -20) rotate(15)">
      <circle cx="0" cy="0" r="22" fill="url(#gold2)" stroke="#fff" stroke-width="2"/>
      <path d="M -12 18 L -18 55 L 0 45 L 18 55 L 12 18 Z" fill="#0284c7"/>
      <text x="0" y="7" font-family="'Cairo', sans-serif" font-size="14" font-weight="900" fill="#78350f" text-anchor="middle">١</text>
    </g>
  </g>

  <!-- Title Badge -->
  <g transform="translate(300, 340)">
    <rect x="-180" y="-22" width="360" height="42" rx="21" fill="rgba(15, 23, 42, 0.75)" stroke="url(#gold2)" stroke-width="1.5"/>
    <text x="0" y="6" font-family="'Cairo', 'Amiri', sans-serif" font-weight="800" font-size="20" fill="#fef08a" text-anchor="middle">التعليم القرآني للمرحلة الابتدائية</text>
  </g>
</svg>
