<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgLiteracy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bgLiteracy)"/>

  <!-- Lantern of Knowledge & Open Book -->
  <g transform="translate(300, 180)">
    <!-- Glow -->
    <circle cx="0" cy="-30" r="110" fill="url(#lampGlow)"/>

    <!-- Traditional Lantern (فانوس النور) -->
    <g transform="translate(0, -60)">
      <polygon points="-16,-20 16,-20 25,-8 16,30 -16,30 -25,-8" fill="#d97706" stroke="#fef08a" stroke-width="2"/>
      <circle cx="0" cy="8" r="10" fill="#fff" opacity="0.8"/>
      <path d="M -16 30 L -8 40 L 8 40 L 16 30 Z" fill="#b45309"/>
      <line x1="0" y1="-20" x2="0" y2="-40" stroke="#fef08a" stroke-width="2.5"/>
      <circle cx="0" cy="-42" r="5" fill="none" stroke="#fef08a" stroke-width="2"/>
    </g>

    <!-- Open Book of Words -->
    <g transform="translate(0, 50)">
      <path d="M 0 -15 C -45 -35, -85 -30, -110 -15 C -110 20, -75 25, 0 30 Z" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
      <path d="M 0 -15 C 45 -35, 85 -30, 110 -15 C 110 20, 75 25, 0 30 Z" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
      <line x1="0" y1="-15" x2="0" y2="30" stroke="#64748b" stroke-width="3"/>
      
      <!-- Arabic Alphabet: أ ب ت ث ج ح خ -->
      <text x="-55" y="10" font-family="'Amiri', serif" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">اقْرَأْ بِاسْمِ رَبِّكَ</text>
      <text x="55" y="10" font-family="'Cairo', sans-serif" font-size="16" font-weight="700" fill="#10b981" text-anchor="middle">نور العلم</text>
    </g>
  </g>

  <!-- Title Badge -->
  <g transform="translate(300, 340)">
    <rect x="-180" y="-22" width="360" height="42" rx="21" fill="rgba(15, 23, 42, 0.75)" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="0" y="6" font-family="'Cairo', sans-serif" font-weight="800" font-size="20" fill="#f8fafc" text-anchor="middle">محو الأمية وتعليم الكبار وتلاوة القرآن</text>
  </g>
</svg>
