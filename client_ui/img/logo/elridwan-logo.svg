<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef9c3" />
      <stop offset="50%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0" />
    </radialGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Circular Base with Shield Border -->
  <circle cx="150" cy="150" r="142" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="5" filter="url(#dropShadow)" />
  <circle cx="150" cy="150" r="133" fill="none" stroke="url(#goldLight)" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.8" />
  <circle cx="150" cy="135" r="90" fill="url(#sunGlow)" />

  <!-- Crescent & Star at Top -->
  <g transform="translate(150, 48) scale(0.9)" filter="url(#dropShadow)">
    <path d="M 0 -18 A 15 15 0 1 1 -12 7 A 12 12 0 1 0 0 -18 Z" fill="url(#goldGrad)" />
    <polygon points="5,-6 7,-1 12,-1 8,2 10,7 5,4 1,7 3,2 -1,-1 4,-1" fill="url(#goldLight)" />
  </g>

  <!-- Islamic Arch Silhouette -->
  <path d="M 90 175 C 90 100, 110 80, 150 70 C 190 80, 210 100, 210 175 Z" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" opacity="0.35" />

  <!-- Quran Rehal (Wooden Stand) -->
  <g transform="translate(150, 150)" filter="url(#dropShadow)">
    <!-- Base Crossed Wood -->
    <path d="M -40 22 L 40 -8 L 48 -2 L -32 28 Z" fill="#78350f" stroke="url(#goldGrad)" stroke-width="1.2" />
    <path d="M 40 22 L -40 -8 L -48 -2 L 32 28 Z" fill="#92400e" stroke="url(#goldGrad)" stroke-width="1.2" />
    
    <!-- Open Book Pages (Quran) -->
    <!-- Left Page -->
    <path d="M 0 -5 C -25 -22, -50 -18, -65 -8 C -66 12, -45 16, 0 20 Z" fill="#fffbeb" stroke="url(#goldGrad)" stroke-width="1.8" />
    <!-- Right Page -->
    <path d="M 0 -5 C 25 -22, 50 -18, 65 -8 C 66 12, 45 16, 0 20 Z" fill="#fef3c7" stroke="url(#goldGrad)" stroke-width="1.8" />
    <!-- Book Spine & Ribbon -->
    <line x1="0" y1="-5" x2="0" y2="20" stroke="#b45309" stroke-width="2.5" />
    <path d="M 0 20 Q -4 28, 0 35 Q 4 28, 0 20" fill="#dc2626" />
    
    <!-- Script Lines simulation -->
    <path d="M -52 -3 Q -35 -10, -12 -2 M -54 5 Q -35 -2, -12 6 M -50 12 Q -35 6, -12 13" stroke="#b45309" stroke-width="1.2" stroke-linecap="round" opacity="0.75" />
    <path d="M 12 -2 Q 35 -10, 52 -3 M 12 6 Q 35 -2, 54 5 M 12 13 Q 35 6, 50 12" stroke="#b45309" stroke-width="1.2" stroke-linecap="round" opacity="0.75" />
    
    <!-- Glowing Verse Sun Burst Symbol in Center -->
    <circle cx="0" cy="7" r="4.5" fill="url(#goldLight)" />
  </g>

  <!-- Ribbon Banner for School Name -->
  <g transform="translate(150, 222)" filter="url(#dropShadow)">
    <path d="M -115 0 L -90 -14 L 90 -14 L 115 0 L 95 24 L -95 24 Z" fill="url(#goldGrad)" stroke="#78350f" stroke-width="1.5" />
    <path d="M -90 -14 L -95 0 L -115 0 Z" fill="#78350f" />
    <path d="M 90 -14 L 95 0 L 115 0 Z" fill="#78350f" />
    
    <!-- School Main Title -->
    <text x="0" y="8" font-family="'Amiri', 'Traditional Arabic', 'Scheherazade', serif" font-weight="900" font-size="20" fill="#0f172a" text-anchor="middle" letter-spacing="0.5">مدرسة الرضوان</text>
  </g>

  <!-- Subtitle Ribbon Below -->
  <text x="150" y="262" font-family="'Cairo', 'Tahoma', sans-serif" font-weight="700" font-size="11.5" fill="url(#goldLight)" text-anchor="middle" letter-spacing="0.8">لعلوم القرآن الكريم والتربية - قجال</text>
  <text x="150" y="278" font-family="'Inter', sans-serif" font-weight="600" font-size="9" fill="#94a3b8" text-anchor="middle" opacity="0.9">FOUNDED 2026</text>
</svg>
