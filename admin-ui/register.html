    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body[data-page="login"],
    body[data-page="register"] {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 20px 15px;
      overflow-y: auto;
    }

    .error-pagewrap {
      width: 100%;
      max-width: 580px;
      margin: auto;
    }

    .custom-login {
      color: #fff;
      margin-bottom: 16px;
      text-align: center;
    }

    .custom-login .page-icon {
      font-size: 36px;
      color: #fff;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 50%;
      margin-bottom: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 72px;
      height: 72px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.25);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .custom-login .page-icon:hover {
      transform: scale(1.08) rotate(-5deg);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
    }

    .custom-login h3 {
      font-weight: 700;
      font-size: 20px;
      letter-spacing: 0.5px;
      margin: 6px 0 4px;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
      font-family: 'Inter', sans-serif;
    }

    .custom-login p {
      color: rgba(255, 255, 255, 0.85);
      font-size: 13px;
      margin: 0;
    }

    .hpanel .panel-body {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      padding: 24px 28px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.2);
      color: #fff;
      animation: fadeInUp 0.5s ease-out both;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .row {
      margin-left: -8px;
      margin-right: -8px;
    }

    .row [class*="col-"] {
      padding-left: 8px;
      padding-right: 8px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      color: #fff !important;
      font-weight: 500;
      margin-bottom: 4px;
      font-size: 13px;
      display: block;
    }

    .form-control {
      background: rgba(255, 255, 255, 0.1) !important;
      border: 1px solid rgba(255, 255, 255, 0.22) !important;
      color: #fff !important;
      border-radius: 10px;
      padding: 10px 14px;
      height: auto;
      font-size: 14px;
      transition: all 0.3s ease;
      width: 100%;
    }

    .form-control:focus {
      background: rgba(255, 255, 255, 0.2) !important;
      border-color: rgba(255, 255, 255, 0.6) !important;
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.1) !important;
      outline: none;
    }

    .form-control::placeholder {
      color: rgba(255, 255, 255, 0.5) !important;
    }

    .help-block {
      color: rgba(255, 255, 255, 0.55) !important;
      margin-top: 4px;
      font-size: 12px;
      display: block;
    }

    .loginbtn {
      background: linear-gradient(135deg, #4ade80, #22c55e) !important;
      border: none !important;
      border-radius: 10px !important;
      padding: 10px !important;
      font-weight: 700 !important;
      font-size: 14px !important;
      margin-top: 10px;
      transition: all 0.3s ease !important;
      color: #064e3b !important;
      letter-spacing: 0.3px;
      width: 100%;
    }

    .loginbtn:hover {
      background: linear-gradient(135deg, #22c55e, #16a34a) !important;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(34, 197, 94, 0.35) !important;
      color: #fff !important;
    }

    .login-footer p {
      color: rgba(255, 255, 255, 0.6);
      margin-top: 14px;
      font-size: 12px;
      text-align: center;
    }

    .error-page-int {
      margin-top: 8vh;
      padding: 0;
      max-width: 500px;
    }

    .secondary-link {
      margin-top: 10px;
    }

    .secondary-btn {
      display: block;
      width: 100%;
      background: linear-gradient(135deg, #60a5fa, #3b82f6) !important;
      border: none !important;
      border-radius: 10px !important;
      padding: 10px !important;
      font-weight: 700 !important;
      font-size: 14px !important;
      text-align: center;
      color: #fff !important;
      letter-spacing: 0.3px;
      text-decoration: none;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .secondary-btn:hover {
      background: linear-gradient(135deg, #3b82f6, #2563eb) !important;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(59, 130, 246, 0.35) !important;
      color: #fff !important;
      text-decoration: none;
    }
    /* Language Switcher */
    .lang-switcher {
      position: fixed;
      top: 16px;
      right: 20px;
      z-index: 9999;
      display: flex;
      align-items: center;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 50px;
      padding: 4px;
      gap: 2px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }
    .lang-btn {
      background: transparent;
      border: none;
      color: rgba(255,255,255,0.7);
      font-size: 13px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.25s ease;
      font-family: 'Inter', sans-serif;
      letter-spacing: 0.5px;
    }
    .lang-btn.active {
      background: #fff;
      color: #667eea;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    .lang-btn:hover:not(.active) {
      color: #fff;
      background: rgba(255,255,255,0.1);
    }
    /* RTL support */
    body[dir="rtl"] .secondary-link { text-align: right; }
    body[dir="rtl"] .checkbox label { flex-direction: row-reverse; justify-content: flex-end; }
    body[dir="rtl"] .lang-switcher { right: auto; left: 20px; }
    body[dir="rtl"] label { text-align: right; display: block; }
    body[dir="rtl"] input { text-align: right; }
    body[dir="rtl"] .help-block { text-align: right; }
    body[dir="rtl"] .login-footer { text-align: center; }

  <!-- Language Switcher -->

        <h3 style="color: #fff; margin-top: 5px; margin-bottom: 5px; font-size: 20px;">Create an Account</h3>

      </div>

        <div class="hpanel">

            <form action="#" id="backend-register-form">
              <div class="row">
                <div class="form-group col-xs-6">
                  <label data-i18n="firstName">First name</label>
                  <input name="first_name" class="form-control" data-i18n-placeholder="firstNamePh" placeholder="John" required>
                </div>
                <div class="form-group col-xs-6">
                  <label data-i18n="lastName">Last name</label>
                  <input name="last_name" class="form-control" data-i18n-placeholder="lastNamePh" placeholder="Doe" required>

                <div class="form-group col-xs-12">
                  <label data-i18n="emailLabel">Email address</label>
                  <input name="email" type="email" class="form-control" data-i18n-placeholder="emailPh" placeholder="admin@school.com" required>
                </div>
                <div class="form-group col-xs-6">
                  <label data-i18n="passwordLabel">Password</label>
                  <input name="password" type="password" class="form-control" data-i18n-placeholder="passwordPh" placeholder="••••••••" required>
                </div>
                <div class="form-group col-xs-6">
                  <label data-i18n="confirmLabel">Repeat Password</label>
                  <input name="confirm_password" type="password" class="form-control" data-i18n-placeholder="confirmPh" placeholder="••••••••" required>
                </div>
              </div>
              <p id="backend-auth-status" class="help-block small"></p>
              <button class="btn btn-success loginbtn" data-i18n="createBtn">Create Account</button>
              <div class="secondary-link">
                <a href="login.html" class="secondary-btn" data-i18n="loginLink">Already have an account? Sign in</a>
              </div>
            </form>

    <!-- i18n Translation Script -->
    <script>
        const registerTranslations = {
            en: {
                subtitle:        'Fill in the form below to get started',
                firstName:       'First name',
                firstNamePh:     'John',
                lastName:        'Last name',
                lastNamePh:      'Doe',
                emailLabel:      'Email address',
                emailPh:         'admin@school.com',
                passwordLabel:   'Password',
                passwordPh:      '••••••••',
                confirmLabel:    'Repeat Password',
                confirmPh:       '••••••••',
                createBtn:       'Create Account',
                loginLink:       'Already have an account? Sign in',
                footer:          '© 2026 School Manager. All rights reserved.'
            },
            ar: {
                subtitle:        'املأ النموذج أدناه للبدء',
                firstName:       'الاسم الأول',
                firstNamePh:     'أحمد',
                lastName:        'الاسم الأخير',
                lastNamePh:      'محمد',
                emailLabel:      'البريد الإلكتروني',
                emailPh:         'admin@school.com',
                passwordLabel:   'كلمة المرور',
                passwordPh:      '••••••••',
                confirmLabel:    'تأكيد كلمة المرور',
                confirmPh:       '••••••••',
                createBtn:       'إنشاء حساب',
                loginLink:       'لديك حساب بالفعل؟ تسجيل الدخول',
                footer:          '© 2026 School Manager. جميع الحقوق محفوظة.'
            }
        };

        function setLang(lang) {
            localStorage.setItem('app_lang', lang);
            const t = registerTranslations[lang];
            const dir = lang === 'ar' ? 'rtl' : 'ltr';

            document.body.setAttribute('dir', dir);
            document.documentElement.setAttribute('lang', lang);

            // Update text nodes
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key] !== undefined) el.textContent = t[key];
            });

            // Update placeholders
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (t[key] !== undefined) el.setAttribute('placeholder', t[key]);
            });

            // Active button state
            document.getElementById('btnEn').classList.toggle('active', lang === 'en');
            document.getElementById('btnAr').classList.toggle('active', lang === 'ar');
        }

        // On load, apply saved language
        (function() {
            const saved = localStorage.getItem('app_lang') || 'en';
            setLang(saved);
        })();
    </script>
