    <!-- i18n Translation Script -->
    <script>
        const loginTranslations = {
            en: {
                subtitle:        'Welcome back! Please login to your account.',
                emailLabel:      'Email',
                emailPlaceholder:'example@gmail.com',
                passwordLabel:   'Password',
                passwordPlaceholder: '******',
                rememberMe:      'Remember me',
                signIn:          'Login',
                registerLink:    'Create an account',
                footer:          'Copyright © 2026 School Manager. All rights reserved.'
            },
            ar: {
                subtitle:        'مرحباً بعودتك! يرجى تسجيل الدخول إلى حسابك.',
                emailLabel:      'البريد الإلكتروني',
                emailPlaceholder:'example@gmail.com',
                passwordLabel:   'كلمة المرور',
                passwordPlaceholder: '******',
                rememberMe:      'تذكرني',
                signIn:          'تسجيل الدخول',
                registerLink:    'إنشاء حساب',
                footer:          'حقوق الطبع والنشر © 2026 مدير المدرسة. جميع الحقوق محفوظة.'
            }
        };

        function setLang(lang) {
            localStorage.setItem('app_lang', lang);
            const t = loginTranslations[lang];
            const dir = lang === 'ar' ? 'rtl' : 'ltr';

            document.body.setAttribute('dir', dir);
            document.documentElement.setAttribute('lang', lang);

            // Update text nodes
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key] !== undefined) el.textContent = t[key];
            });

            // Update placeholders
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (t[key] !== undefined) el.setAttribute('placeholder', t[key]);
            });

            // Active button state
            document.getElementById('btnEn').classList.toggle('active', lang === 'en');
            document.getElementById('btnAr').classList.toggle('active', lang === 'ar');
        }

        // On load, apply saved language
        (function() {
            const saved = localStorage.getItem('app_lang') || 'en';
            setLang(saved);
        })();
    </script>
