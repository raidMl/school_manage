<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add Student | School System Admin</title>
    <link rel="shortcut icon" type="image/x-icon" href="img/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/font-awesome.min.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <style>
      body { font-family: 'Inter', sans-serif; }
      .card-panel { background: #fff; border-radius: 14px; padding: 24px; box-shadow: 0 2px 12px rgba(0,0,0,.06); margin-bottom: 20px; max-width: 900px; }
      .section-title { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: #6c7a8d; border-bottom: 2px solid #f0f4f8; padding-bottom: 8px; margin: 24px 0 16px; }
      .section-title i { margin-right: 6px; }
      .app-checks { display: flex; gap: 6px; flex-wrap: wrap; }
      .app-check-btn { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 20px; border: 1.5px solid #d1d5db; background: #f9fafb; cursor: pointer; font-size: 12px; font-weight: 600; color: #6b7280; transition: all 0.18s; user-select: none; }
      .app-check-btn:hover { border-color: #9ca3af; }
      .app-check-btn.active-wa { border-color: #25D366; background: #e8fdf1; color: #16a34a; }
      .app-check-btn.active-vb { border-color: #7c3aed; background: #f3f0ff; color: #7c3aed; }
      .app-check-btn.active-tg { border-color: #0088cc; background: #e6f4fb; color: #0088cc; }
      .app-check-btn .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; display: inline-block; }
      .health-indicator { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px; }
      .health-option { display: flex; align-items: center; gap: 5px; padding: 6px 14px; border-radius: 20px; border: 1.5px solid #d1d5db; cursor: pointer; font-size: 13px; transition: all 0.18s; }
      .health-option input[type=radio] { display: none; }
      .health-option.selected-healthy { border-color: #16a34a; background: #f0fdf4; color: #16a34a; font-weight: 600; }
      .health-option.selected-special  { border-color: #dc2626; background: #fef2f2; color: #dc2626; font-weight: 600; }
    </style>
</head>
<body data-page="students">
<div id="sidebar-placeholder"></div>
<div class="sb-main">
<div id="header-placeholder"></div>
<div class="sb-content">
<div class="sb-breadcrumb"><i class="fa fa-home"></i> <a href="index.html">Home</a> <span>/</span> <a href="all-students.html">Students</a> <span>/</span> <span>Add</span></div>

<div class="card-panel">
  <h3 style="margin:0 0 4px;font-size:17px;font-weight:700">
    <i class="fa fa-user-plus" style="color:#f7971e"></i>
    <span data-i18n="New Student Registration">New Student Registration</span>
  </h3>
  <p style="color:#888;font-size:13px;margin:0 0 20px" data-i18n="Fill in all required fields to register a new student.">Fill in all required fields to register a new student.</p>
  <div id="backend-form-status" class="alert" style="display:none"></div>
  <form id="backend-add-student-form" novalidate>

    <!-- Personal Info -->
    <div class="section-title"><i class="fa fa-user"></i> <span data-i18n="Personal Information">Personal Information</span></div>
    <div class="row">
      <div class="col-md-6"><div class="form-group">
        <label><span data-i18n="First Name">First Name</span> <span class="text-danger">*</span></label>
        <input type="text" name="first_name" class="form-control" required>
      </div></div>
      <div class="col-md-6"><div class="form-group">
        <label><span data-i18n="Last Name">Last Name</span> <span class="text-danger">*</span></label>
        <input type="text" name="last_name" class="form-control" required>
      </div></div>
    </div>
    <div class="row">
      <div class="col-md-6"><div class="form-group">
        <label><span data-i18n="Email">Email</span> <span class="text-danger">*</span></label>
        <input type="email" name="email" class="form-control" required>
      </div></div>
      <div class="col-md-6"><div class="form-group">
        <label><span data-i18n="Password">Password</span> <span class="text-danger">*</span></label>
        <input type="password" name="password" class="form-control" required>
      </div></div>
    </div>
    <div class="row">
      <div class="col-md-4"><div class="form-group">
        <label data-i18n="Gender">Gender</label>
        <select name="gender" class="form-control">
          <option value="" data-i18n="Select gender">Select gender</option>
          <option value="MALE" data-i18n="Male">Male</option>
          <option value="FEMALE" data-i18n="Female">Female</option>
        </select>
      </div></div>
      <div class="col-md-4"><div class="form-group">
        <label data-i18n="Birth Date">Birth Date</label>
        <input type="date" name="birth_date" class="form-control">
      </div></div>
      <div class="col-md-4"><div class="form-group">
        <label data-i18n="Blood Type">Blood Type</label>
        <select name="blood_type" class="form-control">
          <option value="" data-i18n="Not specified">Not specified</option>
          <option>A+</option><option>A-</option><option>B+</option><option>B-</option>
          <option>AB+</option><option>AB-</option><option>O+</option><option>O-</option>
        </select>
      </div></div>
    </div>

    <!-- Academic -->
    <div class="section-title"><i class="fa fa-graduation-cap"></i> <span data-i18n="Academic">Academic</span></div>
    <div class="row">
      <div class="col-md-12"><div class="form-group">
        <label><span data-i18n="Formation">Formation</span> <span class="text-danger">*</span></label>
        <select id="student-formation-id" name="formation_id" class="form-control" required>
          <option value="" data-i18n="Loading formations...">Loading formations...</option>
        </select>
      </div></div>
    </div>
    <div class="row">
      <div class="col-md-6"><div class="form-group">
        <label data-i18n="Enrollment Date">Enrollment Date</label>
        <input type="date" name="enrollment_date" class="form-control">
      </div></div>
      <div class="col-md-6"><div class="form-group">
        <label data-i18n="Payment Status">Payment Status</label>
        <select name="payment_status" class="form-control">
          <option value="not_paid" data-i18n="Not Paid">Not Paid</option>
          <option value="paid" data-i18n="Paid">Paid</option>
        </select>
      </div></div>
    </div>
    <div class="row">
      <div class="col-md-6"><div class="form-group">
        <label data-i18n="Promo Code">Promo Code</label>
        <select id="student-promo-code" name="promo_code" class="form-control">
          <option value="" data-i18n="No promo code">No promo code</option>
        </select>
      </div></div>
      <div class="col-md-6" id="subscription-plan-group" style="display:none"><div class="form-group">
        <label><span data-i18n="Subscription Plan">Subscription Plan</span> <span class="text-danger">*</span></label>
        <select name="subscription_plan" class="form-control">
          <option value="" data-i18n="Select plan">Select plan</option>
          <option value="1_month" data-i18n="Per Month (1 Month)">Per Month (1 Month)</option>
          <option value="3_months" data-i18n="Per 3 Months">Per 3 Months</option>
          <option value="1_year" data-i18n="Per Year (12 Months)">Per Year (12 Months)</option>
        </select>
      </div></div>
    </div>

    <!-- Parent / Guardian Contact -->
    <div class="section-title"><i class="fa fa-phone"></i> <span data-i18n="Parent / Guardian Contact">Parent / Guardian Contact</span></div>

    <div class="row">
      <div class="col-md-6"><div class="form-group">
        <label data-i18n="Parent Name">Parent Name</label>
        <input type="text" name="parent_name" class="form-control"
          placeholder="Full name of parent" data-i18n-ph="Full name of parent">
      </div></div>
      <div class="col-md-6"><div class="form-group">
        <label><span data-i18n="Phone 1">Phone 1</span> <small class="text-muted">(<span data-i18n="Primary">Primary</span>)</small></label>
        <input type="tel" name="parent_phone" id="phone1-input" class="form-control" placeholder="+213...">
        <input type="hidden" name="phone1_has_whatsapp" id="phone1_has_whatsapp" value="0">
        <input type="hidden" name="phone1_has_viber" id="phone1_has_viber" value="0">
        <input type="hidden" name="phone1_has_telegram" id="phone1_has_telegram" value="0">
        <div class="app-checks" id="phone1-apps" style="display:none; margin-top:8px;">
          <span class="app-check-btn" data-target="phone1_has_whatsapp" data-active="active-wa" onclick="toggleApp(this)"><span class="dot"></span> WhatsApp</span>
          <span class="app-check-btn" data-target="phone1_has_viber" data-active="active-vb" onclick="toggleApp(this)"><span class="dot"></span> Viber</span>
          <span class="app-check-btn" data-target="phone1_has_telegram" data-active="active-tg" onclick="toggleApp(this)"><span class="dot"></span> Telegram</span>
        </div>
      </div></div>
    </div>

    <div class="row">
      <div class="col-md-6"></div>
      <div class="col-md-6"><div class="form-group">
        <label><span data-i18n="Phone 2">Phone 2</span> <small class="text-muted">(<span data-i18n="Optional">Optional</span>)</small></label>
        <input type="tel" name="parent_phone2" id="phone2-input" class="form-control" placeholder="+213...">
        <input type="hidden" name="phone2_has_whatsapp" id="phone2_has_whatsapp" value="0">
        <input type="hidden" name="phone2_has_viber" id="phone2_has_viber" value="0">
        <input type="hidden" name="phone2_has_telegram" id="phone2_has_telegram" value="0">
        <div class="app-checks" id="phone2-apps" style="display:none; margin-top:8px;">
          <span class="app-check-btn" data-target="phone2_has_whatsapp" data-active="active-wa" onclick="toggleApp(this)"><span class="dot"></span> WhatsApp</span>
          <span class="app-check-btn" data-target="phone2_has_viber" data-active="active-vb" onclick="toggleApp(this)"><span class="dot"></span> Viber</span>
          <span class="app-check-btn" data-target="phone2_has_telegram" data-active="active-tg" onclick="toggleApp(this)"><span class="dot"></span> Telegram</span>
        </div>
      </div></div>
    </div>

    <div class="row">
      <div class="col-md-5"><div class="form-group">
        <label><span data-i18n="Guardian Name">Guardian Name</span></label>
        <input type="text" name="guardian_name" class="form-control"
          placeholder="First & Last name" data-i18n-ph="First & Last name">
      </div></div>
      <div class="col-md-4"><div class="form-group">
        <label><span data-i18n="Relationship">Relationship</span></label>
        <input type="text" name="guardian_relationship" class="form-control"
          placeholder="e.g. Uncle, Aunt..." data-i18n-ph="e.g. Uncle, Aunt...">
      </div></div>
      <div class="col-md-3"><div class="form-group">
        <label><span data-i18n="Guardian ID #">Guardian ID #</span></label>
        <input type="text" name="guardian_id_number" class="form-control"
          placeholder="National ID" data-i18n-ph="National ID">
      </div></div>
    </div>

    <div class="row">
      <div class="col-md-6"><div class="form-group">
        <label><span data-i18n="Parents Status">Parents Status</span></label>
        <select name="parents_status" class="form-control">
          <option value="" data-i18n="— Not specified —">— Not specified —</option>
          <option value="together" data-i18n="Together">Together</option>
          <option value="divorced" data-i18n="Divorced">Divorced</option>
          <option value="father_deceased" data-i18n="Father Deceased">Father Deceased</option>
          <option value="mother_deceased" data-i18n="Mother Deceased">Mother Deceased</option>
          <option value="both_deceased" data-i18n="Both Deceased">Both Deceased</option>
          <option value="other" data-i18n="Other">Other</option>
        </select>
      </div></div>
    </div>

    <!-- Health Status -->
    <div class="section-title">
      <i class="fa fa-heartbeat"></i>
      <span data-i18n="Health Status">Health Status</span>
    </div>
    <div class="row">
      <div class="col-md-12"><div class="form-group">
        <label>
          <span data-i18n="Does the student need special care?">Does the student need special care?</span>
        </label>
        <div class="health-indicator">
          <label class="health-option" id="health-no-label" onclick="selectHealth('no')">
            <input type="radio" name="_health_radio" value="no">
            <i class="fa fa-check-circle"></i>
            <span data-i18n="No — Normal Health">No — Normal Health</span>
          </label>
          <label class="health-option" id="health-yes-label" onclick="selectHealth('yes')">
            <input type="radio" name="_health_radio" value="yes">
            <i class="fa fa-exclamation-triangle"></i>
            <span data-i18n="Yes — Needs Special Care">Yes — Needs Special Care</span>
          </label>
        </div>
        <textarea name="health_notes" id="health-notes-field" class="form-control" rows="3"
          placeholder="Describe any health conditions, allergies, or special requirements..."
          data-i18n-ph="Describe any health conditions, allergies, or special requirements..."
          style="margin-top:10px;display:none;resize:vertical;"></textarea>
      </div></div>
    </div>

    <!-- Other -->
    <div class="section-title"><i class="fa fa-image"></i> <span data-i18n="Other">Other</span></div>
    <div class="form-group">
      <label data-i18n="Photo URL">Photo URL</label>
      <div class="input-group">
        <input type="url" name="photo" class="form-control" placeholder="https://example.com/photo.jpg" data-i18n-ph="https://example.com/photo.jpg">
        <span class="input-group-btn">
          <label class="btn btn-default" title="Upload Image" data-i18n-title="Upload Image" style="margin:0;">
            <i class="fa fa-upload" id="icon-upload-student"></i>
            <input type="file" accept="image/*" style="display:none;" onchange="handleCloudinaryUpload(this, document.querySelector('#backend-add-student-form input[name=photo]'), 'icon-upload-student')">
          </label>
        </span>
      </div>
    </div>

    <div class="form-group" style="margin-top:24px; display:flex; gap:10px;">
      <button type="submit" class="btn btn-warning btn-lg">
        <i class="fa fa-save"></i> <span data-i18n="Save Student">Save Student</span>
      </button>
      <a href="all-students.html" class="btn btn-default btn-lg">
        <i class="fa fa-arrow-left"></i> <span data-i18n="Back">Back</span>
      </a>
    </div>
  </form>
</div>

<div id="footer-placeholder"></div>
</div></div>

<script>
  function toggleApp(btn) {
    var targetId = btn.getAttribute('data-target');
    var activeClass = btn.getAttribute('data-active');
    var hiddenInput = document.getElementById(targetId);
    var isActive = btn.classList.contains(activeClass);
    if (isActive) { btn.classList.remove(activeClass); if (hiddenInput) hiddenInput.value = '0'; }
    else { btn.classList.add(activeClass); if (hiddenInput) hiddenInput.value = '1'; }
  }
  function selectHealth(val) {
    var noLabel = document.getElementById('health-no-label');
    var yesLabel = document.getElementById('health-yes-label');
    var notesField = document.getElementById('health-notes-field');
    noLabel.className = 'health-option' + (val === 'no' ? ' selected-healthy' : '');
    yesLabel.className = 'health-option' + (val === 'yes' ? ' selected-special' : '');
    notesField.style.display = val === 'yes' ? 'block' : 'none';
    if (val === 'no') notesField.value = '';
  }
  function setupPhoneToggle(inputId, panelId) {
    var input = document.getElementById(inputId);
    var panel = document.getElementById(panelId);
    if (!input || !panel) return;
    input.addEventListener('input', function() { panel.style.display = this.value.trim() ? 'flex' : 'none'; });
  }
  setupPhoneToggle('phone1-input', 'phone1-apps');
  setupPhoneToggle('phone2-input', 'phone2-apps');
</script>
<script src="js/vendor/jquery-1.12.4.min.js"></script>
<script src="js/bootstrap.min.js"></script>
<script src="js/components.js"></script>
<script src="js/backend.js?v=3"></script>
</body></html>
