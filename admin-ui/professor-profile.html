<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Anti-FOUC & Preloader -->
    <style id="fouc-style">body { opacity: 0; visibility: hidden; }</style>
    <script>
      (function() {
        var lang = localStorage.getItem('app_lang') || 'ar';
        if(lang === 'ar') {
          document.documentElement.dir = 'rtl';
          document.documentElement.lang = 'ar';
        } else {
          document.documentElement.dir = 'ltr';
          document.documentElement.lang = 'en';
        }
      })();
    </script>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Professor Profile | School System Admin</title>
    <link rel="shortcut icon" type="image/x-icon" href="img/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/font-awesome.min.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #f0f2f5;
            color: #1f2937;
        }

        .card-panel {
            background: #ffffff;
            border-radius: 16px;
            padding: 35px;
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.05), 0 4px 10px -3px rgba(0, 0, 0, 0.03);
            margin-bottom: 30px;
            border: 1px solid rgba(229, 231, 235, 0.5);
        }

        /* ── Profile Header ── */
        .profile-header {
            display: flex;
            align-items: center;
            gap: 28px;
            margin: -35px -35px 35px -35px;
            padding: 35px;
            background: linear-gradient(135deg, #f0fdf4 0%, #ecfdf5 50%, #d1fae5 100%);
            border-bottom: 1px solid #a7f3d0;
            border-radius: 16px 16px 0 0;
            position: relative;
            overflow: hidden;
        }

        .profile-header::before {
            content: '';
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            background: radial-gradient(circle at top right, rgba(16, 185, 129, 0.12), transparent 55%);
            pointer-events: none;
        }

        .profile-header::after {
            content: '';
            position: absolute;
            width: 280px; height: 280px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(16,185,129,0.08), transparent 70%);
            top: -80px; right: -60px;
            pointer-events: none;
        }

        .profile-photo {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 8px 24px rgba(16, 185, 129, 0.2);
            border: 4px solid #ffffff;
            position: relative;
            z-index: 1;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .profile-photo:hover {
            transform: scale(1.05) rotate(-2deg);
        }

        .profile-title {
            position: relative;
            z-index: 1;
            flex: 1;
        }

        .profile-title h3 {
            margin: 0 0 8px;
            font-size: 28px;
            font-weight: 700;
            color: #064e3b;
            letter-spacing: -0.02em;
        }

        .profile-title p {
            margin: 6px 0;
            color: #065f46;
            font-size: 14.5px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
        }

        .profile-title i {
            color: #10b981;
            width: 16px;
            text-align: center;
        }

        .prof-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(16,185,129,0.15);
            color: #065f46;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.04em;
            border: 1px solid rgba(16,185,129,0.3);
            margin-top: 6px;
        }

        /* ── Section Title ── */
        .section-title-h4 {
            margin: 10px 0 20px;
            font-size: 13px;
            font-weight: 700;
            color: #374151;
            display: flex;
            align-items: center;
            gap: 8px;
            padding-bottom: 12px;
            border-bottom: 2px solid #f1f5f9;
            text-transform: uppercase;
            letter-spacing: 0.07em;
        }

        .section-title-h4 i {
            color: #10b981;
            font-size: 16px;
        }

        /* ── Detail Grid ── */
        .detail-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 14px;
        }

        .detail-item {
            padding: 18px 20px;
            border-radius: 14px;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .detail-item:hover {
            transform: scale(1.025);
            filter: brightness(0.97);
        }

        .detail-item label {
            display: block;
            margin: 0 0 5px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.07em;
            font-weight: 700;
            opacity: 0.72;
        }

        .detail-item .val {
            font-size: 15px;
            font-weight: 600;
            line-height: 1.4;
        }

        /* Teal / emerald theme */
        .theme-teal .detail-item {
            background: #ecfdf5;
            color: #064e3b;
        }
        .theme-teal .detail-item label { color: #059669; }

        /* Indigo theme */
        .theme-indigo .detail-item {
            background: #eef2ff;
            color: #1e1b4b;
        }
        .theme-indigo .detail-item label { color: #6366f1; }

        /* Amber theme */
        .theme-amber .detail-item {
            background: #fffbeb;
            color: #78350f;
        }
        .theme-amber .detail-item label { color: #d97706; }

        /* Badges */
        .label {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 12px;
        }
        .label-success { background: #dcfce7; color: #166534; }
        .label-danger  { background: #fee2e2; color: #991b1b; }

        /* Edit button */
        .btn-edit-profile {
            position: absolute;
            top: 0; right: 0;
            z-index: 2;
            background: #fff;
            border: 1.5px solid #a7f3d0;
            color: #059669;
            font-weight: 600;
            font-size: 13px;
            padding: 7px 18px;
            border-radius: 10px;
            transition: all 0.18s;
            text-decoration: none;
        }
        .btn-edit-profile:hover {
            background: #ecfdf5;
            border-color: #10b981;
            color: #047857;
            text-decoration: none;
        }

        [dir="rtl"] .profile-header::before {
            background: radial-gradient(circle at top left, rgba(16, 185, 129, 0.12), transparent 55%);
        }
        [dir="rtl"] .profile-header::after { right: auto; left: -60px; }
        [dir="rtl"] .btn-edit-profile { right: auto; left: 0; }

        /* Spinner */
        #tp-loading { padding: 60px; color: #9ca3af; }
        #tp-loading p { margin-top: 14px; font-size: 14px; }
    </style>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#007bff">
    <link rel="apple-touch-icon" href="img/icon-512.jpg">
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js');
        });
      }
    </script>
</head>

<body data-page="professors">
    <div id="sidebar-placeholder"></div>
    <div class="sb-main">
        <div id="header-placeholder"></div>
        <div class="sb-content">
            <div class="sb-breadcrumb">
                <i class="fa fa-home"></i>
                <a href="index.html" data-i18n="Home">Home</a>
                <span>/</span>
                <a href="all-professors.html" data-i18n="Teachers">Teachers</a>
                <span>/</span>
                <span data-i18n="Profile">Profile</span>
            </div>

            <div id="tp-container" class="card-panel">
                <!-- Loading state -->
                <div id="tp-loading" class="text-center">
                    <i class="fa fa-spinner fa-spin fa-2x" style="color:#10b981;"></i>
                    <p data-i18n="Loading Profile...">Loading Profile...</p>
                </div>

                <!-- Content -->
                <div id="tp-content" style="display:none;">

                    <!-- Header -->
                    <div class="profile-header">
                        <img id="tp-photo" class="profile-photo" src="" alt="Teacher Photo">
                        <div class="profile-title">
                            <div class="prof-badge">
                                <i class="fa fa-graduation-cap"></i>
                                <span data-i18n="Professor">Professor</span>
                            </div>
                            <h3 id="tp-name">—</h3>
                            <p><i class="fa fa-id-badge"></i> <span id="tp-emp-num"></span></p>
                            <p><i class="fa fa-envelope"></i> <span id="tp-email"></span></p>
                            <p><span id="tp-status"></span></p>
                        </div>
                        <a id="tp-edit-link" href="#" class="btn-edit-profile">
                            <i class="fa fa-edit"></i> <span data-i18n="Edit">Edit</span>
                        </a>
                    </div>

                    <!-- Professional Info -->
                    <h4 class="section-title-h4">
                        <i class="fa fa-briefcase"></i>
                        <span data-i18n="Professional Information">Professional Information</span>
                    </h4>
                    <div class="detail-grid theme-teal" style="margin-bottom:30px;">
                        <div class="detail-item">
                            <label data-i18n="Speciality">Speciality</label>
                            <div class="val" id="tp-speciality">-</div>
                        </div>
                        <div class="detail-item">
                            <label data-i18n="Diploma">Diploma</label>
                            <div class="val" id="tp-diploma">-</div>
                        </div>
                        <div class="detail-item">
                            <label data-i18n="Hire Date">Hire Date</label>
                            <div class="val" id="tp-hire-date">-</div>
                        </div>
                    </div>

                    <!-- Personal Info -->
                    <h4 class="section-title-h4">
                        <i class="fa fa-user"></i>
                        <span data-i18n="Personal Information">Personal Information</span>
                    </h4>
                    <div class="detail-grid theme-indigo" style="margin-bottom:30px;">
                        <div class="detail-item">
                            <label data-i18n="Gender">Gender</label>
                            <div class="val" id="tp-gender">-</div>
                        </div>
                        <div class="detail-item">
                            <label data-i18n="Birth Date">Birth Date</label>
                            <div class="val" id="tp-birth-date">-</div>
                        </div>
                        <div class="detail-item">
                            <label data-i18n="Phone">Phone</label>
                            <div class="val" id="tp-phone">-</div>
                        </div>
                    </div>

                    <!-- Account Status -->
                    <h4 class="section-title-h4">
                        <i class="fa fa-shield"></i>
                        <span data-i18n="Account">Account</span>
                    </h4>
                    <div class="detail-grid theme-amber">
                        <div class="detail-item">
                            <label data-i18n="Status">Status</label>
                            <div class="val" id="tp-status-card">-</div>
                        </div>
                        <div class="detail-item">
                            <label data-i18n="Role">Role</label>
                            <div class="val" id="tp-role">-</div>
                        </div>
                    </div>

                </div>
            </div>
            <div id="footer-placeholder"></div>
        </div>
    </div>

    <script src="js/vendor/jquery-1.12.4.min.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script src="js/components.js"></script>
    <script src="js/backend.js?v=3"></script>
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        // Set edit link URL with current ID
        var id = new URLSearchParams(window.location.search).get('id');
        if (id) {
          var editLink = document.getElementById('tp-edit-link');
          if (editLink) editLink.href = 'edit-professor.html?id=' + id;
        }
      });
    </script>
</body>

</html>
