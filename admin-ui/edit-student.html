      body { font-family: 'Inter', sans-serif; }
      .form-card { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,.08); max-width: 900px; width: 100%; margin: 0 auto 24px auto; overflow: hidden; }
      .sb-breadcrumb { max-width: 900px; margin: 0 auto 14px auto; }

      .sec-title:first-child { margin-top: 0; }
      .form-group { margin-bottom: 10px; }
      .form-group label { font-size: 12px; font-weight: 600; color: #374151; margin-bottom: 3px; display: block; }

      .row { margin-left: -7px; margin-right: -7px; }
      .row > [class*="col-"] { padding-left: 7px; padding-right: 7px; }
      .input-group .form-control { border-radius: 8px 0 0 8px; }
      .input-group-btn .btn { border-radius: 0 8px 8px 0; height: 34px; padding: 0 12px; border: 1.5px solid #e5e7eb; border-left: none; background: #f9fafb; }
      .btn-submit { background: linear-gradient(135deg, #f7971e, #ffd200); border: none; color: #fff; font-weight: 700; padding: 8px 22px; border-radius: 8px; font-size: 14px; cursor: pointer; transition: opacity .2s; }
      .btn-submit:hover { opacity: .88; }
      .btn-back { background: #f3f4f6; border: 1.5px solid #e5e7eb; color: #374151; font-weight: 500; padding: 8px 18px; border-radius: 8px; font-size: 14px; margin-left: 8px; text-decoration: none; display: inline-block; }
      .btn-back:hover { background: #e5e7eb; color: #111; text-decoration: none; }
      .app-checks { display: flex; gap: 6px; flex-wrap: wrap; }
      .app-check-btn { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 20px; border: 1.5px solid #d1d5db; background: #f9fafb; cursor: pointer; font-size: 11px; font-weight: 600; color: #6b7280; transition: all 0.18s; user-select: none; }
      .app-check-btn:hover { border-color: #9ca3af; }
      .app-check-btn.active-wa { border-color: #25D366; background: #e8fdf1; color: #16a34a; }
      .app-check-btn.active-vb { border-color: #7c3aed; background: #f3f0ff; color: #7c3aed; }
      .app-check-btn.active-tg { border-color: #0088cc; background: #e6f4fb; color: #0088cc; }

      .health-option input[type=radio] { display: none; }
      .health-option.selected-healthy { border-color: #16a34a; background: #f0fdf4; color: #16a34a; font-weight: 600; }
      .health-option.selected-special  { border-color: #dc2626; background: #fef2f2; color: #dc2626; font-weight: 600; }
    </style>

<div id="header-placeholder"></div>
<div class="sb-content">

  <a href="index.html" data-i18n="Home">Home</a> <span>/</span>

</div>

<!-- Hero Banner (Purple Graphic Chart) -->
<div class="page-hero-card no-print">
  <div class="hero-top-row">

<div class="form-card">
  <div class="form-card-body">
    <div id="backend-form-status" class="alert" style="display:none"></div>
    <form id="backend-edit-student-form" novalidate>

      <div class="sec-title"><i class="fa fa-user"></i> <span data-i18n="Personal Information">Personal Information</span></div>
      <div class="row">
        <div class="col-md-4"><div class="form-group">
          <label data-i18n="Registration Number">Registration Number</label>
          <input type="text" name="registration_number" class="form-control" placeholder="Registration #">
        </div></div>
        <div class="col-md-4"><div class="form-group">
          <label data-i18n="First Name">First Name</label>
          <input type="text" name="first_name" class="form-control" required>
        </div></div>
        <div class="col-md-4"><div class="form-group">
          <label data-i18n="Last Name">Last Name</label>
          <input type="text" name="last_name" class="form-control" required>
        </div></div>
      </div>
      <div class="row">
        <div class="col-md-3"><div class="form-group">
          <label data-i18n="Gender">Gender</label>
          <select name="gender" class="form-control">
            <option value="" data-i18n="Select">Select</option>
            <option value="MALE" data-i18n="Male">Male</option>
            <option value="FEMALE" data-i18n="Female">Female</option>
          </select>
        </div></div>
        <div class="col-md-3"><div class="form-group">
          <label data-i18n="Birth Date">Birth Date</label>
          <input type="date" name="birth_date" class="form-control">
        </div></div>
        <div class="col-md-3"><div class="form-group">
          <label data-i18n="Blood Type">Blood Type</label>
          <select name="blood_type" class="form-control">
            <option value="" data-i18n="Not specified">Not specified</option>
            <option value="A+">A+</option><option value="A-">A-</option>
            <option value="B+">B+</option><option value="B-">B-</option>
            <option value="AB+">AB+</option><option value="AB-">AB-</option>
            <option value="O+">O+</option><option value="O-">O-</option>
          </select>
        </div></div>
        <div class="col-md-3"><div class="form-group">
          <label data-i18n="Status">Status</label>
          <select name="is_active" class="form-control">
            <option value="1" data-i18n="Active">Active</option>
            <option value="0" data-i18n="Inactive">Inactive</option>
          </select>
        </div></div>
      </div>

      <div class="sec-title"><i class="fa fa-envelope"></i> <span data-i18n="Account">Account</span></div>
      <div class="row">
        <div class="col-md-6"><div class="form-group">
          <label data-i18n="Email">Email</label>
          <input type="email" name="email" class="form-control">
        </div></div>
        <div class="col-md-6"><div class="form-group">
          <label><span data-i18n="Personal Phone">Personal Phone</span> <small class="text-muted" data-i18n="(Optional)">(Optional)</small></label>
          <input type="tel" name="phone" class="form-control" placeholder="0550 00 00 00" data-i18n-ph="0550 00 00 00">
        </div></div>
      </div>

      <div class="sec-title"><i class="fa fa-graduation-cap"></i> <span data-i18n="Academic">Academic</span></div>
      <div class="row">
        <div class="col-md-6"><div class="form-group">
          <label data-i18n="Formation">Formation</label>
          <select id="student-formation-id" name="formation_id" class="form-control">
            <option value="" data-i18n="Loading formations...">Loading formations...</option>
          </select>
        </div></div>
        <div class="col-md-6"><div class="form-group">
          <label>
            <i class="fa fa-users" style="color:#6c7a8d; margin-right:4px;"></i>
            <span data-i18n="Assign to Group">Assign to Group</span>
            <small class="text-muted" style="font-weight:400;"> &mdash; <span data-i18n="Optional">Optional</span></small>
          </label>
          <select id="student-group-id" name="group_id" class="form-control">
            <option value="" data-i18n="No Group (Optional)">&mdash; No Group (Optional) &mdash;</option>
          </select>
        </div></div>
      </div>
      <div class="row">
        <div class="col-md-3"><div class="form-group">
          <label data-i18n="Enrollment Date">Enrollment Date</label>
          <input type="date" name="enrollment_date" class="form-control">
        </div></div>
        <div class="col-md-3"><div class="form-group">
          <label data-i18n="Payment Status">Payment Status</label>
          <select name="payment_status" class="form-control">
            <option value="not_paid" data-i18n="Not Paid">Not Paid</option>
            <option value="paid" data-i18n="Paid">Paid</option>
          </select>
        </div></div>
        <div class="col-md-3"><div class="form-group">
          <label data-i18n="Promo Code">Promo Code</label>
          <select id="student-promo-code" name="promo_code" class="form-control">
            <option value="" data-i18n="No promo code">No promo code</option>
          </select>
        </div></div>
        <div class="col-md-3"><div class="form-group">
          <label data-i18n="Discount (%)">Discount (%)</label>
          <input type="number" step="0.01" min="0" max="100" name="discount_percent" class="form-control" placeholder="0%">
        </div></div>
      </div>
      <div class="row">
        <div class="col-md-6" id="subscription-plan-group" style="display:none"><div class="form-group">
          <label><span data-i18n="Subscription Plan">Subscription Plan</span> <span class="text-danger">*</span></label>
          <select name="subscription_plan" class="form-control">
            <option value="" data-i18n="Select plan">Select plan</option>
            <option value="1_month" data-i18n="Per Month (1 Month)">Per Month (1 Month)</option>
            <option value="3_months" data-i18n="Per 3 Months">Per 3 Months</option>
            <option value="1_year" data-i18n="Per Year (12 Months)">Per Year (12 Months)</option>
          </select>
        </div></div>
        <div class="col-md-6"><div class="form-group">
          <label data-i18n="Next Payment Date">Next Payment Date</label>
          <input type="date" name="next_payment_date" class="form-control">
        </div></div>
      </div>

      <div class="sec-title"><i class="fa fa-phone"></i> <span data-i18n="Parent / Guardian Contact">Parent / Guardian Contact</span></div>
      <div class="row">
        <div class="col-md-6"><div class="form-group">
          <label data-i18n="Parent Name">Parent Name</label>
          <input type="text" name="parent_name" class="form-control" placeholder="Full name" data-i18n-ph="Full name">
        </div></div>
        <div class="col-md-6"><div class="form-group">
          <label data-i18n="Parent ID Number">Parent ID Number</label>
          <input type="text" name="parent_id_number" class="form-control" dir="rtl">
        </div></div>
      </div>
      <div class="row">
        <div class="col-md-6"><div class="form-group">
          <label><span data-i18n="Phone 1">Phone 1</span></label>
          <input type="tel" name="parent_phone" id="phone1-input" class="form-control" placeholder="+213...">
          <input type="hidden" name="phone1_has_whatsapp" id="phone1_has_whatsapp" value="0">
          <input type="hidden" name="phone1_has_viber" id="phone1_has_viber" value="0">
          <input type="hidden" name="phone1_has_telegram" id="phone1_has_telegram" value="0">
          <div class="app-checks" id="phone1-apps" style="display:none; margin-top:4px;">
            <span class="app-check-btn" data-target="phone1_has_whatsapp" data-active="active-wa" onclick="toggleApp(this)"><span class="dot"></span> WA</span>
            <span class="app-check-btn" data-target="phone1_has_viber" data-active="active-vb" onclick="toggleApp(this)"><span class="dot"></span> VB</span>
            <span class="app-check-btn" data-target="phone1_has_telegram" data-active="active-tg" onclick="toggleApp(this)"><span class="dot"></span> TG</span>
          </div>
        </div></div>
        <div class="col-md-6"><div class="form-group">
          <label><span data-i18n="Phone 2">Phone 2</span></label>
          <input type="tel" name="parent_phone2" id="phone2-input" class="form-control" placeholder="+213...">
          <input type="hidden" name="phone2_has_whatsapp" id="phone2_has_whatsapp" value="0">
          <input type="hidden" name="phone2_has_viber" id="phone2_has_viber" value="0">
          <input type="hidden" name="phone2_has_telegram" id="phone2_has_telegram" value="0">
          <div class="app-checks" id="phone2-apps" style="display:none; margin-top:4px;">
            <span class="app-check-btn" data-target="phone2_has_whatsapp" data-active="active-wa" onclick="toggleApp(this)"><span class="dot"></span> WA</span>
            <span class="app-check-btn" data-target="phone2_has_viber" data-active="active-vb" onclick="toggleApp(this)"><span class="dot"></span> VB</span>
            <span class="app-check-btn" data-target="phone2_has_telegram" data-active="active-tg" onclick="toggleApp(this)"><span class="dot"></span> TG</span>
          </div>
        </div></div>
      </div>
      <div class="row">
        <div class="col-md-4"><div class="form-group">
          <label data-i18n="Guardian Name">Guardian Name</label>
          <input type="text" name="guardian_name" class="form-control">
        </div></div>
        <div class="col-md-4"><div class="form-group">
          <label data-i18n="Relationship">Relationship</label>
          <input type="text" name="guardian_relationship" class="form-control">
        </div></div>
        <div class="col-md-4"><div class="form-group">
          <label data-i18n="Guardian ID #">Guardian ID #</label>
          <input type="text" name="guardian_id_number" class="form-control">
        </div></div>
      </div>
      <div class="row">
        <div class="col-md-6"><div class="form-group">
          <label data-i18n="Parents Status">Parents Status</label>
          <select name="parents_status" class="form-control">
            <option value="" data-i18n="— Not specified —">— Not specified —</option>
            <option value="together" data-i18n="Together">Together</option>
            <option value="divorced" data-i18n="Divorced">Divorced</option>
            <option value="father_deceased" data-i18n="Father Deceased">Father Deceased</option>
            <option value="mother_deceased" data-i18n="Mother Deceased">Mother Deceased</option>
            <option value="both_deceased" data-i18n="Both Deceased">Both Deceased</option>
            <option value="other" data-i18n="Other">Other</option>
          </select>
        </div></div>
        <div class="col-md-6"><div class="form-group">
          <label data-i18n="RFID Tag">RFID Tag</label>
          <input type="text" name="rfid_tag" class="form-control" placeholder="RFID Card ID / Tag">
        </div></div>
      </div>

      <!-- Health Status -->
      <div class="sec-title"><i class="fa fa-heartbeat"></i> <span data-i18n="Health Status">Health Status</span></div>
      <div class="row">
        <div class="col-md-12"><div class="form-group">
          <label>
            <span data-i18n="Does the student need special care?">Does the student need special care?</span>
          </label>
          <div class="health-indicator">
            <label class="health-option" id="health-no-label" onclick="selectHealth('no')">
              <input type="radio" name="_health_radio" value="no">
              <i class="fa fa-check-circle"></i>
              <span data-i18n="No — Normal Health">No — Normal Health</span>
            </label>
            <label class="health-option" id="health-yes-label" onclick="selectHealth('yes')">
              <input type="radio" name="_health_radio" value="yes">
              <i class="fa fa-exclamation-triangle"></i>
              <span data-i18n="Yes — Needs Special Care">Yes — Needs Special Care</span>
            </label>
          </div>
          <textarea name="health_notes" id="health-notes-field" class="form-control" rows="3"
            placeholder="Describe any health conditions, allergies, or special requirements..."
            data-i18n-ph="Describe any health conditions, allergies, or special requirements..."
            style="margin-top:10px; display:none; resize:vertical;"></textarea>
        </div></div>
      </div>

      <div class="sec-title"><i class="fa fa-image"></i> <span data-i18n="Photo">Photo</span></div>
      <div class="row">
        <div class="col-md-9"><div class="form-group">
          <label data-i18n="Photo URL">Photo URL</label>
          <div class="input-group">
            <input type="url" name="photo" id="student-photo-input" class="form-control" placeholder="https://..." data-i18n-ph="https://...">
            <span class="input-group-btn">
              <label class="btn btn-default" title="Upload Image" data-i18n-title="Upload Image" style="margin:0;">
                <i class="fa fa-upload" id="icon-upload-student-edit"></i>
                <input type="file" accept="image/*" style="display:none;" onchange="handleCloudinaryUpload(this, document.querySelector('#backend-edit-student-form input[name=photo]'), 'icon-upload-student-edit')">
              </label>
            </span>
          </div>
        </div></div>
        <div class="col-md-3 text-center">
          <img id="student-photo-preview" src="img/student/default.png" alt="Photo Preview" style="width:58px; height:58px; border-radius:50%; object-fit:cover; border:2px solid #e5e7eb; box-shadow:0 2px 8px rgba(0,0,0,.08); margin-top:14px;">
        </div>
      </div>

      <div style="margin-top:18px; display:flex; align-items:center; gap:10px;">
        <button type="submit" class="btn-submit"><i class="fa fa-save"></i> <span data-i18n="Update Student">Update Student</span></button>
        <a href="all-students.html" class="btn-back"><i class="fa fa-arrow-left"></i> <span data-i18n="Back">Back</span></a>
      </div>
    </form>
  </div>
</div>

<div id="footer-placeholder"></div>
</div></div>

<script>
  function toggleApp(btn) {
    var targetId = btn.getAttribute('data-target');
    var activeClass = btn.getAttribute('data-active');
    var hiddenInput = document.getElementById(targetId);
    var isActive = btn.classList.contains(activeClass);
    if (isActive) { btn.classList.remove(activeClass); if (hiddenInput) hiddenInput.value = '0'; }
    else { btn.classList.add(activeClass); if (hiddenInput) hiddenInput.value = '1'; }
  }
  function selectHealth(val) {
    var noLabel = document.getElementById('health-no-label');
    var yesLabel = document.getElementById('health-yes-label');
    var notesField = document.getElementById('health-notes-field');
    if (noLabel) noLabel.className = 'health-option' + (val === 'no' ? ' selected-healthy' : '');
    if (yesLabel) yesLabel.className = 'health-option' + (val === 'yes' ? ' selected-special' : '');
    if (notesField) {
      notesField.style.display = val === 'yes' ? 'block' : 'none';
      if (val === 'no') notesField.value = '';
    }
  }
  function setupPhoneToggle(inputId, panelId) {
    var input = document.getElementById(inputId);
    var panel = document.getElementById(panelId);
    if (!input || !panel) return;
    input.addEventListener('input', function() { panel.style.display = this.value.trim() ? 'flex' : 'none'; });
  }
  setupPhoneToggle('phone1-input', 'phone1-apps');
  setupPhoneToggle('phone2-input', 'phone2-apps');
</script>
