<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Anti-FOUC & Preloader -->
    <style id="fouc-style">body { opacity: 0; visibility: hidden; }</style>
    <script>
      (function() {
        var lang = localStorage.getItem('app_lang') || 'ar';
        if(lang === 'ar') {
          document.documentElement.dir = 'rtl';
          document.documentElement.lang = 'ar';
        } else {
          document.documentElement.dir = 'ltr';
          document.documentElement.lang = 'en';
        }
      })();
    </script>

    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add Teacher | School System Admin</title>
    <link rel="shortcut icon" type="image/x-icon" href="img/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/font-awesome.min.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <style>
      body { font-family: 'Inter', sans-serif; }
      .form-card { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,.08); max-width: 860px; width: 100%; margin: 0 auto 24px auto; overflow: hidden; }
      .sb-breadcrumb { max-width: 860px; margin: 0 auto 14px auto; }
      .form-card-header { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); padding: 18px 26px; color: #fff; }
      .form-card-header h3 { margin: 0; font-size: 17px; font-weight: 700; }
      .form-card-header p { margin: 3px 0 0; font-size: 12px; opacity: .85; }
      .form-card-body { padding: 20px 26px 22px; }
      .sec-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #9ca3af; border-bottom: 1.5px solid #f0f4f8; padding-bottom: 5px; margin: 16px 0 10px; }
      .form-group { margin-bottom: 10px; }
      .form-group label { font-size: 12px; font-weight: 600; color: #374151; margin-bottom: 3px; display: block; }
      .form-control { height: 34px; font-size: 13px; border-radius: 8px; border: 1.5px solid #e5e7eb; padding: 4px 10px; transition: border-color .15s, box-shadow .15s; }
      .form-control:focus { border-color: #11998e; box-shadow: 0 0 0 3px rgba(17,153,142,.1); outline: none; }
      select.form-control { padding: 4px 8px; }
      .row { margin-left: -7px; margin-right: -7px; }
      .row > [class*="col-"] { padding-left: 7px; padding-right: 7px; }
      .input-group .form-control { border-radius: 8px 0 0 8px; }
      .input-group-btn .btn { border-radius: 0 8px 8px 0; height: 34px; padding: 0 12px; border: 1.5px solid #e5e7eb; border-left: none; background: #f9fafb; }
      .btn-submit { background: linear-gradient(135deg, #11998e, #38ef7d); border: none; color: #fff; font-weight: 600; padding: 8px 22px; border-radius: 8px; font-size: 14px; cursor: pointer; transition: opacity .2s; }
      .btn-submit:hover { opacity: .88; }
      .btn-back { background: #f3f4f6; border: 1.5px solid #e5e7eb; color: #374151; font-weight: 500; padding: 8px 18px; border-radius: 8px; font-size: 14px; margin-left: 8px; text-decoration: none; display: inline-block; }
      .btn-back:hover { background: #e5e7eb; color: #111; text-decoration: none; }
    </style>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#007bff">
    <link rel="apple-touch-icon" href="img/icon-512.jpg">
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js'); });
      }
    </script>
</head>

<body data-page="professors">
<div id="sidebar-placeholder"></div>
<div class="sb-main">
<div id="header-placeholder"></div>
<div class="sb-content">
<div class="sb-breadcrumb">
  <i class="fa fa-home"></i>
  <a href="index.html" data-i18n="Home">Home</a> <span>/</span>
  <a href="all-professors.html" data-i18n="Teachers">Teachers</a> <span>/</span>
  <span data-i18n="Add">Add</span>
</div>

<div class="form-card">
  <div class="form-card-header">
    <h3><i class="fa fa-user-plus"></i> <span data-i18n="New Teacher Registration">New Teacher Registration</span></h3>
    <p data-i18n="Fill in the fields below to register a new teacher.">Fill in the fields below to register a new teacher.</p>
  </div>
  <div class="form-card-body">
    <div id="backend-form-status" class="alert" style="display:none"></div>
    <form id="backend-add-teacher-form" novalidate>

      <div class="sec-title"><i class="fa fa-user"></i> <span data-i18n="Personal Information">Personal Information</span></div>
      <div class="row">
        <div class="col-md-6"><div class="form-group">
          <label><span data-i18n="First Name">First Name</span> <span class="text-danger">*</span></label>
          <input type="text" name="first_name" class="form-control" required>
        </div></div>
        <div class="col-md-6"><div class="form-group">
          <label><span data-i18n="Last Name">Last Name</span> <span class="text-danger">*</span></label>
          <input type="text" name="last_name" class="form-control" required>
        </div></div>
      </div>
      <div class="row">
        <div class="col-md-4"><div class="form-group">
          <label data-i18n="Gender">Gender</label>
          <select name="gender" class="form-control">
            <option value="" data-i18n="Select gender">Select gender</option>
            <option value="MALE" data-i18n="Male">Male</option>
            <option value="FEMALE" data-i18n="Female">Female</option>
          </select>
        </div></div>
        <div class="col-md-4"><div class="form-group">
          <label data-i18n="Birth Date">Birth Date</label>
          <input type="date" name="birth_date" class="form-control">
        </div></div>
        <div class="col-md-4"><div class="form-group">
          <label data-i18n="Blood Type">Blood Type</label>
          <select name="blood_type" class="form-control">
            <option value="" data-i18n="Not specified">Not specified</option>
            <option>A+</option><option>A-</option><option>B+</option><option>B-</option>
            <option>AB+</option><option>AB-</option><option>O+</option><option>O-</option>
          </select>
        </div></div>
      </div>

      <div class="sec-title"><i class="fa fa-envelope"></i> <span data-i18n="Account">Account</span></div>
      <div class="row">
        <div class="col-md-6"><div class="form-group">
          <label><span data-i18n="Email">Email</span> <span class="text-danger">*</span></label>
          <input type="email" name="email" class="form-control" required>
        </div></div>
        <div class="col-md-6"><div class="form-group">
          <label><span data-i18n="Password">Password</span> <span class="text-danger">*</span></label>
          <input type="password" name="password" class="form-control" required>
        </div></div>
      </div>

      <div class="sec-title"><i class="fa fa-graduation-cap"></i> <span data-i18n="Professional">Professional</span></div>
      <div class="row">
        <div class="col-md-4"><div class="form-group">
          <label data-i18n="Speciality">Speciality</label>
          <input type="text" name="speciality" class="form-control" placeholder="e.g. Mathematics" data-i18n-ph="e.g. Mathematics">
        </div></div>
        <div class="col-md-4"><div class="form-group">
          <label data-i18n="Diploma">Diploma</label>
          <input type="text" name="diploma" class="form-control" placeholder="e.g. PhD" data-i18n-ph="e.g. PhD">
        </div></div>
        <div class="col-md-4"><div class="form-group">
          <label data-i18n="Hire Date">Hire Date</label>
          <input type="date" name="hire_date" class="form-control">
        </div></div>
      </div>

      <div class="sec-title"><i class="fa fa-image"></i> <span data-i18n="Photo">Photo</span></div>
      <div class="form-group">
        <label data-i18n="Photo URL">Photo URL</label>
        <div class="input-group">
          <input type="url" name="photo" class="form-control" placeholder="https://example.com/photo.jpg" data-i18n-ph="https://example.com/photo.jpg">
          <span class="input-group-btn">
            <label class="btn btn-default" title="Upload Image" data-i18n-title="Upload Image" style="margin:0;">
              <i class="fa fa-upload" id="icon-upload-prof"></i>
              <input type="file" accept="image/*" style="display:none;" onchange="handleCloudinaryUpload(this, document.querySelector('#backend-add-teacher-form input[name=photo]'), 'icon-upload-prof')">
            </label>
          </span>
        </div>
      </div>

      <div style="margin-top:18px; display:flex; align-items:center; gap:10px;">
        <button type="submit" class="btn-submit"><i class="fa fa-save"></i> <span data-i18n="Save Teacher">Save Teacher</span></button>
        <a href="all-professors.html" class="btn-back"><i class="fa fa-arrow-left"></i> <span data-i18n="Back">Back</span></a>
      </div>
    </form>
  </div>
</div>

<div id="footer-placeholder"></div>
</div></div>
<script src="js/vendor/jquery-1.12.4.min.js"></script>
<script src="js/bootstrap.min.js"></script>
<script src="js/components.js"></script>
<script src="js/backend.js?v=3"></script>
</body></html>
