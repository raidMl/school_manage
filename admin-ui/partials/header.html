<!-- ══════════════ Top Bar ══════════════ -->
<header class="sb-topbar">
    <button class="sb-toggle-btn" id="sb-toggle" onclick="sbToggleSidebar()" aria-label="Toggle sidebar">
        <span></span><span></span><span></span>
    </button>

    <span class="sb-topbar-title" id="sb-page-title">Dashboard</span>

    <div class="sb-topbar-right">
        <!-- Language switcher -->
        <div class="lang-wrap" id="lang-wrap">
            <button class="lang-btn" onclick="this.closest('.lang-wrap').classList.toggle('open')" type="button">
                <i class="fa fa-globe"></i>
                <span id="lang-current-label">EN</span>
            </button>
            <div class="lang-dropdown">
                <a href="#" class="lang-switch-btn" onclick="event.preventDefault(); window.setAppLanguage('en')">🇬🇧 English</a>
                <a href="#" class="lang-switch-btn" onclick="event.preventDefault(); window.setAppLanguage('ar')">🇩🇿 العربية</a>
            </div>
        </div>

        <!-- Notifications -->
        <div class="topbar-user" id="topbar-notif-menu" onclick="this.classList.toggle('open')">
            <button class="topbar-icon-btn" type="button" title="Notifications" style="pointer-events: none;">
                <i class="fa fa-bell"></i>
                <span class="topbar-badge" id="notif-badge" style="display:none;"></span>
            </button>
            <div class="topbar-dropdown" style="width: 360px; padding: 0; box-shadow: 0 12px 36px rgba(0,0,0,0.16); border-radius: 14px; border: 1px solid rgba(0,0,0,0.06); overflow: hidden;">
                <!-- Header -->
                <div style="padding: 14px 16px; background: #fafbfe; border-bottom: 1px solid #edf0f7; display: flex; justify-content: space-between; align-items: center;">
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <i class="fa fa-bell-o" style="color: #4f6eff; font-size: 15px;"></i>
                        <span id="notif-title" data-i18n="Notifications" style="font-weight: 700; color: #1e293b; font-size: 14px;">Notifications</span>
                    </div>
                    <div style="display: flex; align-items: center; gap: 6px;">
                        <span id="notif-badge-urgent" title="Urgent: ≤ 1 day or overdue" style="display:none; font-size: 11px; background: #fee2e2; color: #dc2626; font-weight: 600; padding: 2px 8px; border-radius: 20px; border: 1px solid #fca5a5;">
                            <span class="notif-item-dot dot-red" style="margin-right: 4px; vertical-align: middle;"></span><span id="notif-count-urgent">0</span>
                        </span>
                        <span id="notif-badge-warning" title="Warning: ≤ 1 week" style="display:none; font-size: 11px; background: #fef3c7; color: #d97706; font-weight: 600; padding: 2px 8px; border-radius: 20px; border: 1px solid #fde68a;">
                            <span class="notif-item-dot dot-yellow" style="margin-right: 4px; vertical-align: middle;"></span><span id="notif-count-warning">0</span>
                        </span>
                    </div>
                </div>

                <!-- Scrollable list -->
                <div id="notif-list" style="max-height: 320px; overflow-y: auto;">
                    <div style="padding: 30px 20px; text-align: center; color: #94a3b8; font-size: 13px;">
                        <i class="fa fa-check-circle-o" style="font-size: 28px; color: #cbd5e1; display: block; margin-bottom: 8px;"></i>
                        <span id="notif-empty-text" data-i18n="No payment alerts">No payment alerts</span>
                    </div>
                </div>

                <!-- Footer with See All -->
                <div style="padding: 10px 14px; background: #f8fafc; border-top: 1px solid #edf0f7; text-align: center;">
                    <a href="subscription-notifications.html" id="notif-see-all-btn" style="display: flex; align-items: center; justify-content: center; gap: 6px; color: #4f6eff; font-size: 13px; font-weight: 600; text-decoration: none; padding: 6px 12px; border-radius: 8px; transition: background .2s;">
                        <span id="notif-see-all-text" data-i18n="See all in table">See all in table</span>
                        <i class="fa fa-arrow-right" style="font-size: 11px;"></i>
                    </a>
                </div>
            </div>
        </div>

        <!-- User menu -->
        <div class="topbar-user" id="topbar-user-menu" onclick="this.classList.toggle('open')">
            <img src="https://ui-avatars.com/api/?name=Admin&background=4f6eff&color=fff&size=64"
                 id="header-user-avatar" alt="User">
            <span class="topbar-user-name" id="backend-user-name">Loading...</span>
            <i class="fa fa-chevron-down" style="font-size:10px;color:#aaa;margin-left:2px"></i>
            <div class="topbar-dropdown">
                <a href="index.html"><i class="fa fa-home"></i> Dashboard</a>
                <a href="setup-school.html"><i class="fa fa-cog"></i> School Settings</a>
                <a href="#" data-backend-logout><i class="fa fa-sign-out"></i> Log Out</a>
            </div>
        </div>
    </div>
</header>
