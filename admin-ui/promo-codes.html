<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Anti-FOUC & Preloader -->
    <style id="fouc-style">body { opacity: 0; visibility: hidden; }</style>
    <script>
      (function() {
        var lang = localStorage.getItem('app_lang') || 'ar';
        if(lang === 'ar') {
          document.documentElement.dir = 'rtl';
          document.documentElement.lang = 'ar';
        } else {
          document.documentElement.dir = 'ltr';
          document.documentElement.lang = 'en';
        }
      })();
    </script>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Promo Codes | School System Admin</title>
    <link rel="shortcut icon" type="image/x-icon" href="img/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/font-awesome.min.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <style>
        body{font-family:'Inter',sans-serif;background:#f5f7fb}
        .card-panel{background:#fff;border-radius:16px;padding:22px;box-shadow:0 2px 14px rgba(15,23,42,.06);margin-bottom:20px}
        .promo-card{background:linear-gradient(135deg,#f8fbff 0%,#ffffff 100%);border:1px solid #e7eef8;border-radius:14px;padding:16px}
        .promo-badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
        .promo-badge.active{background:#e8f8ef;color:#1d7a45}
        .promo-badge.inactive{background:#fce7e7;color:#b42318}
        .promo-pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef4ff;color:#3456d6;font-size:12px;font-weight:600}
        .table thead th{background:#f8fafc;border-bottom:0;font-size:13px;font-weight:700;color:#475569}
        .table tbody td{vertical-align:middle}
        /* Generate Promo Button — matches btn-table-excel graphic style */
        .btn-promo-generate {
          display: inline-flex;
          align-items: center;
          justify-content: center;
          gap: 7px;
          width: 100%;
          height: 38px;
          padding: 0 18px;
          font-size: 13px;
          font-weight: 700;
          color: #ffffff !important;
          background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
          border: 1px solid #3730a3;
          border-radius: 8px;
          cursor: pointer;
          box-shadow: 0 2px 8px rgba(79, 70, 229, 0.30), inset 0 1px 0 rgba(255,255,255,0.15);
          transition: all 0.2s ease-in-out;
          text-decoration: none !important;
          letter-spacing: 0.01em;
          position: relative;
          overflow: hidden;
        }
        .btn-promo-generate::before {
          content: '';
          position: absolute;
          top: 0; left: -100%;
          width: 60%;
          height: 100%;
          background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
          transition: left 0.4s ease;
        }
        .btn-promo-generate:hover::before {
          left: 150%;
        }
        .btn-promo-generate:hover {
          background: linear-gradient(135deg, #4338ca 0%, #4f46e5 100%);
          box-shadow: 0 5px 14px rgba(79, 70, 229, 0.42);
          transform: translateY(-1px);
          color: #ffffff !important;
        }
        .btn-promo-generate:active {
          transform: translateY(0);
          box-shadow: 0 1px 4px rgba(79, 70, 229, 0.25);
        }
        .btn-promo-generate:disabled {
          opacity: 0.65;
          cursor: not-allowed;
          transform: none;
        }
        .btn-promo-generate i {
          font-size: 14px;
        }
    </style>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#007bff">
    <link rel="apple-touch-icon" href="img/icon-512.jpg">
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js');
        });
      }
    </script>
</head>

<body data-page="courses">
    <div id="sidebar-placeholder"></div>
    <div class="sb-main">
        <div id="header-placeholder"></div>
        <div class="sb-content">
            <div class="sb-breadcrumb">
                <i class="fa fa-home"></i>
                <a href="index.html">Home</a>
                <span>/</span>
                <span>Promo Codes</span>
            </div>

            <!-- Hero Banner (Purple Graphic Chart) -->
            <div class="page-hero-card">
                <div class="hero-top-row">
                    <div class="hero-info-area">
                        <div class="page-avatar-badge">
                            <i class="fa fa-tag"></i>
                        </div>
                        <div class="hero-text">
                            <h2 data-i18n="Promo Codes">Promo Codes</h2>
                            <div class="hero-badges-row">
                                <span class="hero-pill">
                                    <i class="fa fa-percent"></i>
                                    <span data-i18n="Discounts & Promotions">Discounts &amp; Promotions</span>
                                </span>
                                <span class="hero-pill">
                                    <i class="fa fa-ticket"></i>
                                    <span id="hero-total-promos">0</span> <span data-i18n="Active Codes">Active Codes</span>
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card-panel" style="margin-bottom: 20px;">
                <div class="section-header-bar" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid #f1f5f9;">
                    <div class="section-title">
                        <h3 style="margin:0;font-size:18px;font-weight:700;color:#0f172a;display:flex;align-items:center;gap:10px;">
                            <i class="fa fa-plus-circle" style="color:#6366f1;"></i>
                            <span data-i18n="Generate Promo Code">Generate Promo Code</span>
                        </h3>
                        <p style="margin:4px 0 0;color:#64748b;font-size:13px;">Create discounts for a specific formation or subscription plan.</p>
                    </div>
                </div>
                <form id="backend-add-promo-form" class="row">
                    <div class="col-md-3">
                        <div class="form-group">
                            <label>Formation</label>
                            <select id="promo-formation-id" name="formation_id" class="form-control" required>
                                <option value="">Loading formations...</option>
                            </select>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="form-group">
                            <label>Code</label>
                            <input type="text" name="code" class="form-control" placeholder="e.g. SUMMER50" required>
                        </div>
                    </div>
                    <div class="col-md-2">
                        <div class="form-group">
                            <label>Discount %</label>
                            <input type="number" name="discount_percent" class="form-control" min="1" max="100" required>
                        </div>
                    </div>
                    <div class="col-md-2">
                        <div class="form-group">
                            <label>Type</label>
                            <select name="type" class="form-control" required>
                                <option value="many_students">Many Students</option>
                                <option value="single_student">Single Student</option>
                            </select>
                        </div>
                    </div>
                    <div class="col-md-2" style="padding-top: 24px;">
                        <button type="submit" class="btn-promo-generate"><i class="fa fa-plus-circle"></i> <span data-i18n="Generate">إنشاء</span></button>
                    </div>
                </form>
            </div>

            <div class="card-panel">
                <div class="section-header-bar" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid #f1f5f9;">
                    <div class="section-title">
                        <h3 style="margin:0;font-size:18px;font-weight:700;color:#0f172a;display:flex;align-items:center;gap:10px;">
                            <i class="fa fa-list" style="color:#6366f1;"></i>
                            <span data-i18n="Promo Codes List">Promo Codes List</span>
                        </h3>
                        <p style="margin:4px 0 0;color:#64748b;font-size:13px;">Manage active and inactive promo codes.</p>
                    </div>
                </div>
                <div id="backend-promos-status" class="alert" style="display:none"></div>
                <div class="table-responsive">
                    <table id="backend-promos-table" class="table table-striped table-hover table-bordered">
                        <thead><tr>
                            <th>Code</th><th>Formation</th><th>Discount (%)</th><th>Type</th><th>Status</th><th width="140">Actions</th>
                        </tr></thead>
                        <tbody><tr><td colspan="6" class="text-center">Loading...</td></tr></tbody>
                    </table>
                </div>
            </div>
            <div id="footer-placeholder"></div>
        </div>
    </div>
    <script src="js/vendor/jquery-1.12.4.min.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script src="js/components.js"></script>
    <script src="js/backend.js?v=3"></script>
</body>
</html>
