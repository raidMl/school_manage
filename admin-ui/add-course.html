<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add Formation | School System Admin</title>
    <link rel="shortcut icon" type="image/x-icon" href="img/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/font-awesome.min.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <style>body{font-family:'Inter',sans-serif}.card-panel{background:#fff;border-radius:14px;padding:24px;box-shadow:0 2px 12px rgba(0,0,0,.06);margin-bottom:20px;max-width:860px}</style>
</head>
<body data-page="courses">
<div id="sidebar-placeholder"></div>
<div class="sb-main">
<div id="header-placeholder"></div>
<div class="sb-content">
<div class="sb-breadcrumb"><i class="fa fa-home"></i> <a href="index.html" data-i18n="Home">Home</a> <span>/</span> <a href="all-courses.html" data-i18n="Formations">Formations</a> <span>/</span> <span data-i18n="Add">Add</span></div>

<div class="card-panel">
  <h3 style="margin:0 0 4px;font-size:17px;font-weight:700"><i class="fa fa-book" style="color:#4facfe"></i> <span data-i18n="Add Formation">Add Formation</span></h3>
  <p style="color:#888;font-size:13px;margin:0 0 20px" data-i18n="Create a new training formation.">Create a new training formation.</p>
  <div id="backend-form-status" class="alert" style="display:none"></div>
  <form id="backend-add-formation-form" novalidate>
    <div class="form-group">
      <label data-i18n="Title">Title <span class="text-danger">*</span></label>
      <input type="text" name="title" class="form-control"
             placeholder="e.g. Web Development Bootcamp"
             data-i18n-ph="e.g. Web Development Bootcamp" required>
    </div>
    <div class="form-group">
      <label data-i18n="Description">Description</label>
      <textarea name="description" class="form-control" rows="3"
                placeholder="Formation description..."
                data-i18n-ph="Formation description..."></textarea>
    </div>
    <div class="row">
      <div class="col-md-6">
        <div class="form-group" id="teacher-group">
          <label data-i18n="Assign Teacher">Assign Teacher <small class="text-muted" data-i18n="(optional)">(optional)</small></label>
          <select id="formation-teacher-id" name="teacher_id" class="form-control">
            <option value="" data-i18n="Loading...">Loading teachers...</option>
          </select>
          <small class="help-block" data-i18n="Leave empty for subscriptions and assign later when creating a group.">Leave empty for subscriptions and assign later when creating a group.</small>
        </div>
      </div>
      <div class="col-md-6">
        <div class="form-group">
          <label data-i18n="Image URL">Image URL</label>
          <div class="input-group">
            <input type="url" name="image" class="form-control"
                   placeholder="https://example.com/cover.jpg"
                   data-i18n-ph="https://example.com/cover.jpg">
            <span class="input-group-btn">
              <label class="btn btn-default" title="Upload Image" data-i18n-title="Upload Image" style="margin:0; border-radius:0;">
                <i class="fa fa-upload" id="icon-upload-course"></i>
                <input type="file" accept="image/*" style="display:none;" onchange="handleCloudinaryUpload(this, document.querySelector('#backend-add-formation-form input[name=image]'), 'icon-upload-course')">
              </label>
              <button class="btn btn-default" type="button" id="btn-search-web-image" title="Search Web" data-i18n-title="Search Web">
                <i class="fa fa-search"></i>
              </button>
            </span>
          </div>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-md-4">
        <div class="form-group">
          <label data-i18n="Duration (hours)">Duration (hours)</label>
          <input type="number" name="duration_hours" class="form-control" min="1"
                 placeholder="e.g. 40" data-i18n-ph="e.g. 40">
        </div>
      </div>
      <div class="col-md-4">
        <div class="form-group" id="formation-price-group">
          <label data-i18n="Price (DA)">Price (DA)</label>
          <input type="number" name="price" class="form-control" value="0" min="0" step="0.01">
          <small class="help-block" data-i18n="Used for formations.">Used for formations.</small>
        </div>
      </div>
      <div class="col-md-4">
        <div class="form-group">
          <label data-i18n="Type">Type</label>
          <select name="type" class="form-control">
            <option value="formation" data-i18n="Formation">Formation</option>
            <option value="subscription" data-i18n="Subscription">Subscription</option>
          </select>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-md-4">
        <div class="form-group">
          <label data-i18n="Status">Status</label>
          <select name="status" class="form-control">
            <option value="open" data-i18n="Open">Open</option>
            <option value="closed" data-i18n="Closed">Closed</option>
          </select>
        </div>
      </div>
      <div class="col-md-4">
        <div class="form-group">
          <label data-i18n="Niveau">Niveau</label>
          <select name="niveau" class="form-control">
            <option value="begin" data-i18n="Beginner">Beginner</option>
            <option value="intermediate" data-i18n="Intermediate">Intermediate</option>
            <option value="advanced" data-i18n="Advanced">Advanced</option>
          </select>
        </div>
      </div>
      <div class="col-md-4">
        <div class="form-group">
          <label data-i18n="Number of Places">Number of Places</label>
          <input type="number" name="places" class="form-control" value="0" min="0">
        </div>
      </div>
    </div>
    <div id="subscription-prices-group" style="display:none">
      <div class="row">
        <div class="col-md-4"><div class="form-group"><label data-i18n="Monthly Price (DA)">Monthly Price (DA)</label><input type="number" name="price_monthly" class="form-control" min="0" step="0.01"></div></div>
        <div class="col-md-4"><div class="form-group"><label data-i18n="3-Month Price (DA)">3-Month Price (DA)</label><input type="number" name="price_3_months" class="form-control" min="0" step="0.01"></div></div>
        <div class="col-md-4"><div class="form-group"><label data-i18n="Yearly Price (DA)">Yearly Price (DA)</label><input type="number" name="price_1_year" class="form-control" min="0" step="0.01"></div></div>
      </div>
    </div>
    <div class="row">
      <div class="col-md-6"><div class="form-group"><label data-i18n="Start Date">Start Date</label><input type="date" name="start_date" class="form-control"></div></div>
      <div class="col-md-6"><div class="form-group"><label data-i18n="End Date">End Date</label><input type="date" name="end_date" class="form-control"></div></div>
    </div>
    <div class="form-group" style="margin-top:20px">
      <button type="submit" class="btn btn-primary btn-lg"><i class="fa fa-save"></i> <span data-i18n="Save Formation">Save Formation</span></button>
      <a href="all-courses.html" class="btn btn-default btn-lg" style="margin-left:10px"><i class="fa fa-arrow-left"></i> <span data-i18n="Back">Back</span></a>
    </div>
  </form>
</div>

<div id="footer-placeholder"></div>
</div></div>

<!-- Web Image Search Modal -->
<div class="modal fade" id="webImageModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content" style="border-radius:12px;">
      <div class="modal-header" style="border-bottom:1px solid #f0f0f0">
        <button type="button" class="close" data-dismiss="modal"><span>&times;</span></button>
        <h4 class="modal-title"><i class="fa fa-picture-o"></i> <span data-i18n="Search Web Images">Search Web Images</span></h4>
      </div>
      <div class="modal-body">
        <div class="input-group" style="margin-bottom: 20px;">
          <input type="text" id="web-image-search-input" class="form-control" placeholder="Search..." data-i18n-ph="Search...">
          <span class="input-group-btn">
            <button class="btn btn-primary" id="btn-trigger-web-search"><i class="fa fa-search"></i> <span data-i18n="Search">Search</span></button>
          </span>
        </div>
        <div id="web-image-results" class="row" style="display:flex; flex-wrap:wrap;"></div>
        <div id="web-image-loading" style="display:none; text-align:center; padding:40px;"><i class="fa fa-spinner fa-spin fa-2x" style="color:#4facfe"></i></div>
        <div id="web-image-empty" style="display:none; text-align:center; padding:40px; color:#888;"><span data-i18n="No images found.">No images found.</span></div>
      </div>
    </div>
  </div>
</div>

<script src="js/vendor/jquery-1.12.4.min.js"></script>
<script src="js/bootstrap.min.js"></script>
<script src="js/i18n.js"></script>
<script src="js/components.js"></script>
<script src="js/backend.js?v=3"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
  var titleInput = document.querySelector('input[name="title"]');
  var imageInput = document.querySelector('input[name="image"]');
  var btnSearch = document.getElementById('btn-search-web-image');
  var modal = document.getElementById('webImageModal');
  var searchInput = document.getElementById('web-image-search-input');
  var btnTriggerSearch = document.getElementById('btn-trigger-web-search');
  var resultsContainer = document.getElementById('web-image-results');
  var loadingSpinner = document.getElementById('web-image-loading');
  var emptyState = document.getElementById('web-image-empty');

  function base() {
    var l = window.location;
    return (l.hostname === 'localhost' || l.hostname === '127.0.0.1')
      ? l.protocol + '//' + l.hostname + ':5000' : '';
  }

  function doSearch(query) {
    if (!query) return;
    resultsContainer.innerHTML = '';
    emptyState.style.display = 'none';
    loadingSpinner.style.display = 'block';

    var token = localStorage.getItem('school_system_token');
    fetch(base() + '/api/image-search?q=' + encodeURIComponent(query), {
      headers: token ? { 'Authorization': 'Bearer ' + token } : {}
    }).then(function(r) { return r.json(); }).then(function(data) {
      loadingSpinner.style.display = 'none';
      var images = data.results || [];

      if (images.length === 0) {
        emptyState.style.display = 'block';
      } else {
        images.forEach(function(img) {
          var col = document.createElement('div');
          col.className = 'col-md-4 col-sm-6';
          col.style.marginBottom = '15px';
          col.innerHTML =
            '<div class="web-img-result" data-url="' + img.image + '" style="cursor:pointer; border-radius:10px; overflow:hidden; border:2px solid transparent; transition:all 0.2s; box-shadow:0 2px 8px rgba(0,0,0,.08);">' +
              '<div style="height:130px; background-image:url(' + img.thumbnail + '); background-size:cover; background-position:center;"></div>' +
              '<div style="padding:6px 8px; font-size:11px; color:#555; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">' + img.title + '</div>' +
            '</div>';
          resultsContainer.appendChild(col);
        });

        resultsContainer.querySelectorAll('.web-img-result').forEach(function(el) {
          el.addEventListener('click', function() {
            var selectedUrl = this.getAttribute('data-url');
            if (imageInput) imageInput.value = selectedUrl;
            $(modal).modal('hide');
          });
          el.addEventListener('mouseover', function() { this.style.borderColor = '#4facfe'; this.style.transform = 'translateY(-2px)'; });
          el.addEventListener('mouseout',  function() { this.style.borderColor = 'transparent'; this.style.transform = ''; });
        });
      }
    }).catch(function() {
      loadingSpinner.style.display = 'none';
      emptyState.style.display = 'block';
    });
  }

  if(btnSearch) {
    btnSearch.addEventListener('click', function() {
      var query = titleInput ? titleInput.value.trim() : '';
      if(searchInput) searchInput.value = query;
      $(modal).modal('show');
      if(query) doSearch(query);
    });
  }

  if(btnTriggerSearch) {
    btnTriggerSearch.addEventListener('click', function() {
      doSearch(searchInput.value.trim());
    });
  }
  
  if(searchInput) {
    searchInput.addEventListener('keyup', function(e) {
      if(e.key === 'Enter') doSearch(this.value.trim());
    });
  }
});
</script>
</body></html>
