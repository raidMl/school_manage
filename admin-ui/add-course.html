<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add Formation | School System Admin</title>
    <link rel="shortcut icon" type="image/x-icon" href="img/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/font-awesome.min.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <style>body{font-family:'Inter',sans-serif}.card-panel{background:#fff;border-radius:14px;padding:24px;box-shadow:0 2px 12px rgba(0,0,0,.06);margin-bottom:20px;max-width:860px}</style>
</head>
<body data-page="courses">
<div id="sidebar-placeholder"></div>
<div class="sb-main">
<div id="header-placeholder"></div>
<div class="sb-content">
<div class="sb-breadcrumb"><i class="fa fa-home"></i> <a href="index.html" data-i18n="Home">Home</a> <span>/</span> <a href="all-courses.html" data-i18n="Formations">Formations</a> <span>/</span> <span data-i18n="Add">Add</span></div>

<div class="card-panel">
  <h3 style="margin:0 0 4px;font-size:17px;font-weight:700"><i class="fa fa-book" style="color:#4facfe"></i> <span data-i18n="Add Formation">Add Formation</span></h3>
  <p style="color:#888;font-size:13px;margin:0 0 20px" data-i18n="Create a new training formation.">Create a new training formation.</p>
  <div id="backend-form-status" class="alert" style="display:none"></div>
  <form id="backend-add-formation-form" novalidate>
    <div class="form-group">
      <label data-i18n="Title">Title <span class="text-danger">*</span></label>
      <input type="text" name="title" class="form-control"
             placeholder="e.g. Web Development Bootcamp"
             data-i18n-ph="e.g. Web Development Bootcamp" required>
    </div>
    <div class="form-group">
      <label data-i18n="Description">Description</label>
      <textarea name="description" class="form-control" rows="3"
                placeholder="Formation description..."
                data-i18n-ph="Formation description..."></textarea>
    </div>
    <div class="row">
      <div class="col-md-6">
        <div class="form-group" id="teacher-group">
          <label data-i18n="Assign Teacher">Assign Teacher <small class="text-muted" data-i18n="(optional)">(optional)</small></label>
          <select id="formation-teacher-id" name="teacher_id" class="form-control">
            <option value="" data-i18n="Loading...">Loading teachers...</option>
          </select>
          <small class="help-block" data-i18n="Leave empty for subscriptions and assign later when creating a group.">Leave empty for subscriptions and assign later when creating a group.</small>
        </div>
      </div>
      <div class="col-md-6">
        <div class="form-group">
          <label data-i18n="Image URL">Image URL</label>
          <input type="url" name="image" class="form-control"
                 placeholder="https://example.com/cover.jpg"
                 data-i18n-ph="https://example.com/cover.jpg">
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-md-4">
        <div class="form-group">
          <label data-i18n="Duration (hours)">Duration (hours)</label>
          <input type="number" name="duration_hours" class="form-control" min="1"
                 placeholder="e.g. 40" data-i18n-ph="e.g. 40">
        </div>
      </div>
      <div class="col-md-4">
        <div class="form-group" id="formation-price-group">
          <label data-i18n="Price (DA)">Price (DA)</label>
          <input type="number" name="price" class="form-control" value="0" min="0" step="0.01">
          <small class="help-block" data-i18n="Used for formations.">Used for formations.</small>
        </div>
      </div>
      <div class="col-md-4">
        <div class="form-group">
          <label data-i18n="Type">Type</label>
          <select name="type" class="form-control">
            <option value="formation" data-i18n="Formation">Formation</option>
            <option value="subscription" data-i18n="Subscription">Subscription</option>
          </select>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-md-4">
        <div class="form-group">
          <label data-i18n="Status">Status</label>
          <select name="status" class="form-control">
            <option value="open" data-i18n="Open">Open</option>
            <option value="closed" data-i18n="Closed">Closed</option>
          </select>
        </div>
      </div>
      <div class="col-md-4">
        <div class="form-group">
          <label data-i18n="Niveau">Niveau</label>
          <select name="niveau" class="form-control">
            <option value="begin" data-i18n="Beginner">Beginner</option>
            <option value="intermediate" data-i18n="Intermediate">Intermediate</option>
            <option value="advanced" data-i18n="Advanced">Advanced</option>
          </select>
        </div>
      </div>
      <div class="col-md-4">
        <div class="form-group">
          <label data-i18n="Number of Places">Number of Places</label>
          <input type="number" name="places" class="form-control" value="0" min="0">
        </div>
      </div>
    </div>
    <div id="subscription-prices-group" style="display:none">
      <div class="row">
        <div class="col-md-4"><div class="form-group"><label data-i18n="Monthly Price (DA)">Monthly Price (DA)</label><input type="number" name="price_monthly" class="form-control" min="0" step="0.01"></div></div>
        <div class="col-md-4"><div class="form-group"><label data-i18n="3-Month Price (DA)">3-Month Price (DA)</label><input type="number" name="price_3_months" class="form-control" min="0" step="0.01"></div></div>
        <div class="col-md-4"><div class="form-group"><label data-i18n="Yearly Price (DA)">Yearly Price (DA)</label><input type="number" name="price_1_year" class="form-control" min="0" step="0.01"></div></div>
      </div>
    </div>
    <div class="row">
      <div class="col-md-6"><div class="form-group"><label data-i18n="Start Date">Start Date</label><input type="date" name="start_date" class="form-control"></div></div>
      <div class="col-md-6"><div class="form-group"><label data-i18n="End Date">End Date</label><input type="date" name="end_date" class="form-control"></div></div>
    </div>
    <div class="form-group" style="margin-top:20px">
      <button type="submit" class="btn btn-primary btn-lg"><i class="fa fa-save"></i> <span data-i18n="Save Formation">Save Formation</span></button>
      <a href="all-courses.html" class="btn btn-default btn-lg" style="margin-left:10px"><i class="fa fa-arrow-left"></i> <span data-i18n="Back">Back</span></a>
    </div>
  </form>
</div>

<div id="footer-placeholder"></div>
</div></div>
<script src="js/vendor/jquery-1.12.4.min.js"></script>
<script src="js/bootstrap.min.js"></script>
<script src="js/i18n.js"></script>
<script src="js/components.js"></script>
<script src="js/backend.js?v=3"></script>
</body></html>
